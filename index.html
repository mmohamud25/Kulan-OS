<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulan OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050508;--surface:#0f1117;--surface2:#161922;--surface3:#1c2130;
  --t1:#f8fafc;--t2:#94a3b8;--t3:#3d4a5c;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --shadow:0 8px 32px rgba(0,0,0,0.5);

  /* Tab colors */
  --c-dashboard:#3b82f6;
  --c-projects:#10b981;
  --c-tasks:#f59e0b;
  --c-focus:#8b5cf6;
  --c-goals:#f43f5e;
  --c-infra:#06b6d4;
  --c-study:#f97316;
  --c-someday:#94a3b8;
  --c-log:#14b8a6;
  --c-settings:#64748b;

  --current-color:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Outfit',sans-serif;font-size:14px;background:var(--bg);color:var(--t1);line-height:1.6;}
h1,h2,h3,.serif{font-family:'Syne',sans-serif;}
input,textarea,select{font-family:'Outfit',sans-serif;font-size:14px;outline:none;color:var(--t1);}
input::placeholder,textarea::placeholder{color:var(--t3);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.07);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.13);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.fade-up{animation:fadeUp 0.22s ease;}
.pulse{animation:pulse 2s infinite;}

/* ── LOADING ─────────────────────────────── */
#loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:14px;}
.ld-ring{width:32px;height:32px;border:2px solid var(--surface3);border-top-color:var(--c-dashboard);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-text{font-size:13px;color:var(--t3);letter-spacing:1px;}

/* ── LOGIN ───────────────────────────────── */
#login-screen{display:none;align-items:center;justify-content:center;height:100vh;background:var(--bg);}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:44px 40px;width:400px;animation:scaleIn 0.3s ease;}
.login-brand{font-size:9px;color:var(--t3);letter-spacing:3.5px;text-transform:uppercase;margin-bottom:6px;}
.login-title{font-family:'Syne',sans-serif;font-size:28px;color:var(--t1);margin-bottom:6px;font-weight:700;}
.login-sub{font-size:13px;color:var(--t3);margin-bottom:32px;}
.fl{margin-bottom:16px;}
.fl label{display:block;font-size:11px;color:var(--t2);margin-bottom:7px;letter-spacing:0.8px;text-transform:uppercase;font-weight:500;}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--t1);padding:11px 14px;transition:border-color 0.15s;}
.fi:focus{border-color:var(--c-dashboard);}
.btn-login{width:100%;background:var(--c-dashboard);border:none;border-radius:10px;color:#fff;padding:13px;font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;margin-top:4px;transition:opacity 0.15s,transform 0.1s;}
.btn-login:hover{opacity:0.9;}
.btn-login:active{transform:scale(0.99);}
.login-err{font-size:12px;color:#f43f5e;margin-top:10px;text-align:center;min-height:18px;}

/* ── APP SHELL ───────────────────────────── */
#app{display:none;height:100vh;flex-direction:row;}

/* ── SIDEBAR ─────────────────────────────── */
#sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;flex-shrink:0;}
.sb-top{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.sb-org{font-size:9px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:5px;font-weight:600;}
.sb-name{font-family:'Syne',sans-serif;font-size:18px;color:var(--t1);font-weight:700;letter-spacing:-0.3px;}
.sb-qs{margin:12px 10px 0;display:flex;gap:6px;}
.sb-qa-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border-radius:9px;border:1px solid var(--border2);background:rgba(59,130,246,0.08);color:var(--c-dashboard);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:500;transition:all 0.15s;}
.sb-qa-btn:hover{background:rgba(59,130,246,0.15);}
.sb-search-btn{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;}
.sb-search-btn:hover{color:var(--t1);border-color:var(--border2);}
#sb-nav{flex:1;padding:10px 8px;overflow-y:auto;}
.nav-group-label{font-size:9px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;padding:10px 10px 5px;font-weight:600;}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;border:none;cursor:pointer;background:transparent;color:var(--t2);font-size:13.5px;font-family:'Outfit',sans-serif;text-align:left;margin-bottom:1px;transition:all 0.12s;font-weight:400;position:relative;}
.nav-btn .nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;opacity:0.7;}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--t1);}
.nav-btn.active{font-weight:500;}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;background:rgba(244,63,94,0.2);color:#f43f5e;padding:1px 7px;border-radius:8px;}
.nav-sep{height:1px;background:var(--border);margin:7px 10px;}
#sb-bottom{padding:12px 14px;border-top:1px solid var(--border);}
.sb-user{font-size:11px;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.sb-user-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 3s infinite;}
.sb-actions{display:flex;gap:6px;}
.sb-act-btn{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.12s;flex:1;text-align:center;}
.sb-act-btn:hover{color:var(--t1);border-color:var(--border2);}

/* ── MAIN ────────────────────────────────── */
#main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:14px;flex-shrink:0;}
#topbar-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;flex:1;}
#topbar-actions{display:flex;gap:8px;align-items:center;}
#main{flex:1;overflow-y:auto;padding:28px;}

/* ── SHARED ──────────────────────────────── */
.sl{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-weight:600;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;transition:border-color 0.15s;}
.card-sm{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;}
.pbar-wrap{border-radius:10px;overflow:hidden;background:rgba(255,255,255,0.05);}
.pbar-fill{border-radius:10px;transition:width 0.4s ease;}
.flex-b{display:flex;justify-content:space-between;align-items:center;}
.flex-g{display:flex;align-items:center;gap:8px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* ── BUTTONS ─────────────────────────────── */
.btn{padding:8px 18px;border-radius:9px;border:none;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--t2);}
.btn-ghost:hover{color:var(--t1);border-color:var(--border2);background:rgba(255,255,255,0.04);}
.btn-danger{background:rgba(244,63,94,0.12);border:1px solid rgba(244,63,94,0.25);color:#f43f5e;}
.btn-danger:hover{background:rgba(244,63,94,0.2);}
.btn-colored{color:#fff;}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--t3);display:inline-flex;align-items:center;border-radius:5px;transition:all 0.12s;}
.icon-btn:hover{color:var(--t1);background:rgba(255,255,255,0.06);}
.icon-btn.del:hover{color:#f43f5e;background:rgba(244,63,94,0.1);}
.row-btns{display:flex;gap:2px;opacity:0;transition:opacity 0.12s;}
.card:hover .row-btns,.p-card:hover .row-btns,.t-card:hover .row-btns{opacity:1;}

/* ── FILTERS ─────────────────────────────── */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.flabel{font-size:9px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-right:2px;font-weight:600;}
.fbtn{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.12s;}
.fbtn.active{border-color:var(--current-color);color:var(--current-color);background:rgba(255,255,255,0.04);}
.fbtn:hover:not(.active){color:var(--t1);}
.fdiv{width:1px;height:18px;background:var(--border);margin:0 4px;}

/* ── PROJECT CARDS ───────────────────────── */
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.p-card{background:var(--surface);border-radius:14px;padding:20px;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;border:1px solid transparent;}
.p-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.p-card-glow{position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;pointer-events:none;opacity:0.15;}
.p-card-vert{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
.p-card-name{font-family:'Syne',sans-serif;font-size:17px;margin-bottom:13px;line-height:1.25;font-weight:700;}
.p-card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.h-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.p-prog-bar{height:2px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;margin-top:12px;}
.p-prog-fill{height:100%;border-radius:10px;}

/* ── KANBAN ──────────────────────────────── */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
.k-col{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;min-height:220px;transition:border-color 0.15s;}
.k-col.drag-over{border-color:var(--current-color);}
.k-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.k-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.k-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.k-cnt{margin-left:auto;font-size:10px;color:var(--t3);background:rgba(255,255,255,0.05);padding:1px 8px;border-radius:8px;}
.t-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:9px;cursor:grab;transition:box-shadow 0.15s,opacity 0.15s;}
.t-card:active{cursor:grabbing;}
.t-card.dragging{opacity:0.35;}
.t-card-proj{font-size:10px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
.t-card-text{font-size:14px;line-height:1.45;margin-bottom:9px;}
.t-card-meta{display:flex;justify-content:space-between;align-items:center;}
.pri-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.pri-pip{width:5px;height:5px;border-radius:50%;}
.tag-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:1px;text-transform:uppercase;}
.rec-tag{font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(59,130,246,0.15);color:#3b82f6;border:1px solid rgba(59,130,246,0.2);margin-bottom:6px;display:inline-block;}

/* ── STATS GRID ──────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;}
.stat-num{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1;margin-bottom:5px;}
.stat-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:0.7px;line-height:1.4;font-weight:500;}

/* ── ALERTS ──────────────────────────────── */
.alert-bar{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start;}
.alert-icon{font-size:18px;margin-top:1px;flex-shrink:0;}
.alert-item{font-size:13px;color:var(--t1);line-height:1.6;}
.alert-type{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#f59e0b;margin-right:6px;}

/* ── FOCUS ITEMS ─────────────────────────── */
.focus-item{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;transition:opacity 0.2s;}
.focus-item.done{opacity:0.45;}
.f-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--t3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;margin-top:1px;}
.f-check.checked{background:var(--c-focus);border-color:var(--c-focus);}
.f-text{flex:1;font-size:14px;line-height:1.4;}
.f-text.done-text{text-decoration:line-through;color:var(--t3);}
.f-proj{font-size:10px;color:var(--t3);margin-top:3px;}

/* ── SOMEDAY ITEMS ───────────────────────── */
.sd-item{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;}
.sd-cat{font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:1px;flex-shrink:0;}
.sd-text{flex:1;font-size:14px;}

/* ── SEARCH OVERLAY ──────────────────────── */
#search-overlay{display:none;position:fixed;inset:0;z-index:200;align-items:flex-start;justify-content:center;padding-top:100px;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);}
#search-overlay.show{display:flex;}
.search-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:580px;max-width:92vw;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.6);animation:scaleIn 0.18s ease;}
.search-input-wrap{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);}
.search-icon{color:var(--t3);flex-shrink:0;}
#search-input{flex:1;background:transparent;border:none;color:var(--t1);font-size:16px;font-family:'Outfit',sans-serif;}
.search-results{max-height:360px;overflow-y:auto;padding:8px;}
.sr-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;transition:background 0.1s;}
.sr-item:hover{background:var(--surface2);}
.sr-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;width:56px;flex-shrink:0;}
.sr-text{font-size:14px;flex:1;}
.sr-sub{font-size:11px;color:var(--t3);}
.search-empty{text-align:center;padding:32px;font-size:13px;color:var(--t3);}

/* ── QUICK ADD OVERLAY ───────────────────── */
#qa-overlay{display:none;position:fixed;inset:0;z-index:180;align-items:flex-start;justify-content:center;padding-top:130px;}
#qa-overlay.show{display:flex;}
.qa-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);}
.qa-box{position:relative;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:18px 20px;width:560px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:fadeUp 0.18s ease;}
.qa-hint{font-size:10px;color:var(--t3);margin-bottom:10px;letter-spacing:0.3px;}
#qa-input{width:100%;background:transparent;border:none;color:var(--t1);font-size:17px;font-family:'Outfit',sans-serif;padding:0;margin-bottom:14px;}
.qa-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.qa-sel{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--t2);padding:6px 11px;font-size:12px;font-family:'Outfit',sans-serif;cursor:pointer;}

/* ── MODAL ───────────────────────────────── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:150;align-items:center;justify-content:center;}
#modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:30px 32px;width:500px;max-width:94vw;max-height:88vh;overflow-y:auto;animation:scaleIn 0.2s ease;}
.modal-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:24px;}
.m-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.m-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:18px;border-top:1px solid var(--border);}
.fl2{margin-bottom:14px;}
.fl2 label{display:block;font-size:10px;color:var(--t2);margin-bottom:6px;letter-spacing:0.8px;text-transform:uppercase;font-weight:600;}
.fi2{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--t1);padding:10px 13px;transition:border-color 0.15s;font-family:'Outfit',sans-serif;}
.fi2:focus{border-color:var(--current-color);}
textarea.fi2{resize:vertical;min-height:80px;}
select.fi2{cursor:pointer;}

/* ── FOCUS MODE ──────────────────────────── */
#focus-mode{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;}
#focus-mode.show{display:flex;}
.fm-label{font-size:12px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.fm-task{font-family:'Syne',sans-serif;font-size:28px;color:var(--t1);max-width:640px;text-align:center;line-height:1.3;margin-bottom:32px;font-weight:700;}
.fm-time{font-family:'Syne',sans-serif;font-size:72px;color:var(--c-focus);line-height:1;margin-bottom:28px;font-weight:800;letter-spacing:-2px;}
.fm-time.warn{color:#f43f5e;}
.fm-controls{display:flex;gap:10px;}
.fm-btn{padding:12px 28px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--t1);font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.15s;}
.fm-btn.primary{background:var(--c-focus);border-color:var(--c-focus);color:#fff;}
.fm-btn:hover{border-color:var(--border2);}
.fm-sessions{font-size:12px;color:var(--t3);margin-top:20px;}
.fm-exit{position:fixed;top:20px;right:20px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--t3);font-size:12px;cursor:pointer;padding:6px 12px;font-family:'Outfit',sans-serif;transition:all 0.15s;}
.fm-exit:hover{color:var(--t1);}

/* ── TOAST ───────────────────────────────── */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:11px 22px;font-size:13px;color:var(--t1);opacity:0;transition:all 0.22s;z-index:400;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── SETTINGS ────────────────────────────── */
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-size:14px;color:var(--t1);margin-bottom:3px;}
.setting-sub{font-size:12px;color:var(--t3);}

<script>
// ── CONFIG ────────────────────────────────────────────────────
const SUPA_URL  = 'https://advphrgxoemjhgsqxkbl.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdnBocmd4b2Vtamhnc3F4a2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MzAyMjYsImV4cCI6MjA5MTAwNjIyNn0.8tiWdrqxgFvXLWCuHr3Z2KMOMMw8msU95QmKG9CfuP8';
const {createClient}=supabase;
const db=createClient(SUPA_URL,SUPA_ANON);

// ── PALETTE ───────────────────────────────────────────────────
const NAV_COLOR={dashboard:'#3b82f6',projects:'#10b981',tasks:'#f59e0b',focus:'#8b5cf6',goals:'#f43f5e',infra:'#06b6d4',study:'#f97316',someday:'#94a3b8',log:'#14b8a6',settings:'#64748b'};
const NAV_ITEMS=[
  {id:'dashboard',label:'Dashboard'},
  {id:'projects', label:'Projects'},
  {id:'tasks',    label:'Tasks'},
  {id:'focus',    label:'Weekly Focus'},
  {id:'goals',    label:'Goals'},
  {id:'infra',    label:'Infrastructure'},
  {id:'study',    label:'Study Tracker'},
  {id:'someday',  label:'Parking Lot'},
  {id:'log',      label:'Daily Log'},
  {id:'settings', label:'Settings'},
];
const SM={complete:{l:'Complete',c:'#10b981'},live:{l:'Live',c:'#3b82f6'},active:{l:'Active',c:'#8b5cf6'},'in-progress':{l:'In Progress',c:'#f59e0b'},'at-risk':{l:'At Risk',c:'#f43f5e'},pending:{l:'Pending',c:'#64748b'},stable:{l:'Stable',c:'#10b981'},todo:{l:'To Do',c:'#64748b'},review:{l:'In Review',c:'#3b82f6'},done:{l:'Done',c:'#10b981'}};
const PM={urgent:{l:'Urgent',c:'#f43f5e'},high:{l:'High',c:'#f59e0b'},medium:{l:'Medium',c:'#8b5cf6'},low:{l:'Low',c:'#10b981'}};
const TC={INFRA:'#f43f5e',BUILD:'#3b82f6',CONTENT:'#8b5cf6',SYSTEM:'#f59e0b',LAUNCH:'#10b981',STUDY:'#f97316',UPDATE:'#64748b'};
const VERTS=['Kulan Institute','Kulan Studio','Kulan Group','Personal'];
const PSTS=['active','in-progress','complete','live','at-risk','pending'];
const PRIS=['urgent','high','medium','low'];
const TCOLS=['todo','in-progress','review','done'];
const TAGS=Object.keys(TC);
const COLORS=['#3b82f6','#10b981','#8b5cf6','#f59e0b','#f43f5e','#06b6d4','#f97316','#94a3b8','#14b8a6'];
const RECS=['none','daily','weekly','monthly'];
const CAT_COLORS={General:'#64748b',Kulan:'#3b82f6',Content:'#8b5cf6',Tech:'#f59e0b',Personal:'#10b981',Business:'#06b6d4'};

// ── STATE ─────────────────────────────────────────────────────
let S={section:'dashboard',selProj:null,fV:'All',fS:'All',fP:'All',
  projects:[],tasks:[],goals:[],infra:[],logs:[],domains:[],
  focus:[],someday:[],timeLogs:[],settings:{density:'comfortable',focusMode:false}};
let dragId=null;
let pomo={on:false,paused:false,rem:25*60,iv:null,task:'',sessions:0};

// ── HELPERS ───────────────────────────────────────────────────
const ic=(d,s=15,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONS={plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',edit:'<path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>',check:'<path d="M5 13l4 4L19 7"/>',timer:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',focus:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',task:'<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>',chevronR:'<path d="M9 18l6-6-6-6"/>'};
const bx=(n,s=15,c='currentColor')=>ic(ICONS[n]||'',s,c);
const badge=s=>{const m=SM[s]||{l:s,c:'#64748b'};return `<span class="badge" style="background:${m.c}15;color:${m.c};border:1px solid ${m.c}25">${m.l}</span>`;};
const pri=p=>{const m=PM[p]||{l:p,c:'#64748b'};return `<span class="pri-pill" style="color:${m.c}"><span class="pri-pip" style="background:${m.c}"></span>${m.l}</span>`;};
const tag=t=>{const c=TC[t]||'#64748b';return `<span class="tag-pill" style="background:${c}18;color:${c}">${t}</span>`;};
const pbar=(pct,col,h=4)=>`<div class="pbar-wrap" style="height:${h}px"><div class="pbar-fill" style="width:${pct}%;height:${h}px;background:linear-gradient(90deg,${col}80,${col})"></div></div>`;
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pn=id=>(S.projects.find(p=>p.id===id)||{}).name||'';
const pc=id=>(S.projects.find(p=>p.id===id)||{}).color||'#64748b';
const fd=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const mon=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d.toISOString().split('T')[0];};
const fmts=s=>{const m=Math.floor(s/60),sec=s%60;return `${m}:${String(sec).padStart(2,'0')}`;};
const cc=()=>NAV_COLOR[S.section]||'#3b82f6';
const setCC=()=>document.documentElement.style.setProperty('--current-color',cc());

function toast(msg,dur=2600){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);}

// ── HEALTH ────────────────────────────────────────────────────
function health(p){
  let s=100;
  if(p.status==='at-risk')s-=30;
  const pt=S.tasks.filter(t=>t.project_id===p.id);
  s-=pt.filter(t=>t.priority==='urgent'&&t.status!=='done').length*15;
  s-=pt.filter(t=>t.due_date&&t.status!=='done'&&new Date(t.due_date+'T00:00:00')<new Date()).length*10;
  if(S.infra.find(i=>i.project===p.name&&i.status==='at-risk'))s-=20;
  if(S.logs.find(l=>l.project===p.name&&new Date(l.created_at)>new Date(Date.now()-7*864e5)))s+=10;
  return Math.max(0,Math.min(100,s));
}
const hc=s=>s>=80?'#10b981':s>=60?'#f59e0b':s>=40?'#f97316':'#f43f5e';
const pprog=id=>{const t=S.tasks.filter(x=>x.project_id===id);if(!t.length)return null;return Math.round(t.filter(x=>x.status==='done').length/t.length*100);};

// ── ALERTS ────────────────────────────────────────────────────
function alerts(){
  const now=new Date(),soon=new Date(now.getTime()+7*864e5),out=[];
  S.goals.filter(g=>g.deadline&&new Date(g.deadline+'T00:00:00')>=now&&new Date(g.deadline+'T00:00:00')<=soon).forEach(g=>out.push({name:g.name,date:g.deadline,type:'Goal'}));
  S.tasks.filter(t=>t.status!=='done'&&t.due_date&&new Date(t.due_date+'T00:00:00')>=now&&new Date(t.due_date+'T00:00:00')<=soon).forEach(t=>out.push({name:t.text,date:t.due_date,type:'Task'}));
  return out;
}

// ── POMODORO ──────────────────────────────────────────────────
function pomoPB(){
  const d=document.getElementById('fm-timer');
  const b=document.getElementById('fm-play');
  if(!d)return;
  d.textContent=fmts(pomo.rem);
  d.className='fm-time'+(pomo.rem<=60?' warn':'');
  if(b)b.textContent=pomo.on&&!pomo.paused?'⏸ Pause':'▶ Start';
}
function pomoStart(){
  if(pomo.on&&!pomo.paused){pomo.paused=true;clearInterval(pomo.iv);pomoPB();return;}
  if(pomo.paused){pomo.paused=false;}
  else{if(pomo.rem<=0)pomo.rem=25*60;}
  pomo.on=true;pomo.paused=false;
  pomo.iv=setInterval(()=>{
    pomo.rem--;
    if(pomo.rem<=0){
      clearInterval(pomo.iv);pomo.on=false;pomo.rem=0;pomo.sessions++;
      const sc=document.getElementById('fm-sessions');
      if(sc)sc.textContent=`${pomo.sessions} session${pomo.sessions!==1?'s':''} today`;
      if(pomo.task)db.from('logs').insert({text:`Completed a 25-min focus session${pomo.task?' on '+pomo.task:''}`,tag:'SYSTEM',project:pomo.task||null});
      toast('🍅 Session complete. Take a break.');
    }
    pomoPB();
  },1000);
  pomoPB();
}
function pomoReset(){clearInterval(pomo.iv);pomo.on=false;pomo.paused=false;pomo.rem=25*60;pomoPB();}
function openFocusMode(taskText=''){
  pomo.task=taskText;
  const t=document.getElementById('fm-task-text');
  if(t)t.textContent=taskText||'No task selected';
  document.getElementById('focus-mode').classList.add('show');
  pomoPB();
}
function closeFocusMode(){pomoReset();document.getElementById('focus-mode').classList.remove('show');}

// ── SEARCH ────────────────────────────────────────────────────
function openSearch(){document.getElementById('search-overlay').classList.add('show');setTimeout(()=>document.getElementById('search-input').focus(),50);}
function closeSearch(){document.getElementById('search-overlay').classList.remove('show');document.getElementById('search-input').value='';document.getElementById('search-results').innerHTML='';}
function runSearch(q){
  if(!q.trim()){document.getElementById('search-results').innerHTML='';return;}
  const ql=q.toLowerCase();
  const results=[];
  S.projects.filter(p=>p.name.toLowerCase().includes(ql)||((p.notes||'').toLowerCase().includes(ql))).forEach(p=>results.push({type:'Project',color:NAV_COLOR.projects,text:p.name,sub:p.vertical||'',id:p.id,action:()=>{S.section='projects';S.selProj=p.id;closeSearch();render();}}));
  S.tasks.filter(t=>t.text.toLowerCase().includes(ql)).forEach(t=>results.push({type:'Task',color:NAV_COLOR.tasks,text:t.text,sub:pn(t.project_id),id:t.id,action:()=>{S.section='tasks';closeSearch();render();}}));
  S.logs.filter(l=>l.text.toLowerCase().includes(ql)).slice(0,3).forEach(l=>results.push({type:'Log',color:NAV_COLOR.log,text:l.text,sub:fd(l.created_at),id:l.id,action:()=>{S.section='log';closeSearch();render();}}));
  S.goals.filter(g=>g.name.toLowerCase().includes(ql)).forEach(g=>results.push({type:'Goal',color:NAV_COLOR.goals,text:g.name,sub:`${g.progress||0}% complete`,id:g.id,action:()=>{S.section='goals';closeSearch();render();}}));
  const rDiv=document.getElementById('search-results');
  if(!results.length){rDiv.innerHTML='<div class="search-empty">No results found</div>';return;}
  rDiv.innerHTML=results.slice(0,10).map((r,i)=>`<div class="sr-item" data-sri="${i}"><span class="sr-type" style="color:${r.color}">${r.type}</span><span class="sr-text">${esc(r.text)}</span><span class="sr-sub">${esc(r.sub)}</span></div>`).join('');
  rDiv.querySelectorAll('[data-sri]').forEach(el=>{el.onclick=()=>results[parseInt(el.dataset.sri)].action();});
}

// ── QUICK ADD ─────────────────────────────────────────────────
function openQA(){
  const ps=document.getElementById('qa-proj');
  ps.innerHTML='<option value="">No project</option>'+S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  document.getElementById('qa-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('qa-input').focus(),50);
}
function closeQA(){document.getElementById('qa-overlay').classList.remove('show');document.getElementById('qa-input').value='';}
async function submitQA(){
  const text=document.getElementById('qa-input').value.trim();
  const type=document.getElementById('qa-type').value;
  const pid=document.getElementById('qa-proj').value||null;
  const prio=document.getElementById('qa-pri').value;
  if(!text)return;
  let row;
  if(type==='task'){row=await dbi('tasks',{text,project_id:pid,status:'todo',priority:prio,tag:'UPDATE'});if(row)S.tasks.unshift(row);}
  else if(type==='log'){row=await dbi('logs',{text,tag:'UPDATE',project:pid?pn(pid):null});if(row)S.logs.unshift(row);}
  else if(type==='someday'){row=await dbi('someday',{text,category:'General'});if(row)S.someday.unshift(row);}
  else if(type==='focus'){row=await dbi('weekly_focus',{text,project_id:pid,week_of:mon(),done:false});if(row)S.focus.unshift(row);}
  toast('Added.'); closeQA(); render();
}

// ── AUTH ──────────────────────────────────────────────────────
async function login(){
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err');
  err.textContent='';
  if(!email||!pass){err.textContent='Enter your email and password.';return;}
  document.getElementById('l-btn').textContent='Signing in...';
  const {error}=await db.auth.signInWithPassword({email,password:pass});
  document.getElementById('l-btn').textContent='Sign In';
  if(error){err.textContent=error.message;return;}
  await boot();
}
async function logout(){await db.auth.signOut();document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex';}

// ── DATA ──────────────────────────────────────────────────────
async function loadAll(){
  const [p,t,g,i,l,d,f,s,tl]=await Promise.all([
    db.from('projects').select('*').order('created_at',{ascending:false}),
    db.from('tasks').select('*').order('created_at',{ascending:false}),
    db.from('goals').select('*').order('created_at',{ascending:false}),
    db.from('infra').select('*').order('created_at',{ascending:false}),
    db.from('logs').select('*').order('created_at',{ascending:false}),
    db.from('study_domains').select('*').order('cert,name'),
    db.from('weekly_focus').select('*').gte('week_of',mon()).order('created_at',{ascending:false}),
    db.from('someday').select('*').order('created_at',{ascending:false}),
    db.from('time_logs').select('*').order('created_at',{ascending:false}),
  ]);
  S.projects=p.data||[];S.tasks=t.data||[];S.goals=g.data||[];
  S.infra=i.data||[];S.logs=l.data||[];S.domains=d.data||[];
  S.focus=f.data||[];S.someday=s.data||[];S.timeLogs=tl.data||[];
}
async function dbi(table,data){const {data:r,error}=await db.from(table).insert(data).select().single();if(error){toast('Error: '+error.message);return null;}return r;}
async function dbu(table,id,data){const {error}=await db.from(table).update(data).eq('id',id);if(error){toast('Error: '+error.message);return false;}return true;}
async function dbd(table,id){const {error}=await db.from(table).delete().eq('id',id);if(error){toast('Error: '+error.message);return false;}return true;}

// ── SIDEBAR ───────────────────────────────────────────────────
function renderSB(){
  const uc=S.tasks.filter(t=>t.priority==='urgent'&&t.status!=='done').length;
  document.getElementById('sb-nav').innerHTML=NAV_ITEMS.map((n,i)=>{
    const col=NAV_COLOR[n.id];
    const isAct=S.section===n.id;
    if(i===4||i===8)return `<div class="nav-sep"></div><button class="nav-btn ${isAct?'active':''}" data-nav="${n.id}" style="${isAct?`color:${col};background:${col}12`:''}"  onmouseenter="this.style.color='${col}'" onmouseleave="this.style.color='${isAct?col:'var(--t2)'}'">${isAct?`<span style="position:absolute;left:0;top:20%;bottom:20%;width:3px;background:${col};border-radius:0 3px 3px 0"></span>`:''}<span class="nav-dot" style="background:${col}"></span>${n.label}${n.id==='tasks'&&uc>0?`<span class="nav-badge">${uc}</span>`:''}</button>`;
    return `<button class="nav-btn ${isAct?'active':''}" data-nav="${n.id}" style="${isAct?`color:${col};background:${col}12`:''}" onmouseenter="this.style.color='${col}'" onmouseleave="this.style.color='${isAct?col:'var(--t2)'}'">${isAct?`<span style="position:absolute;left:0;top:20%;bottom:20%;width:3px;background:${col};border-radius:0 3px 3px 0"></span>`:''}<span class="nav-dot" style="background:${col}"></span>${n.label}${n.id==='tasks'&&uc>0?`<span class="nav-badge">${uc}</span>`:''}</button>`;
  }).join('');
  document.getElementById('sb-bottom').innerHTML=`
    <div class="sb-user"><span class="sb-user-dot"></span>Muzz · Kulan Group Ltd</div>
    <div class="sb-actions">
      <button class="sb-act-btn" id="focus-mode-btn">🍅 Focus</button>
      <button class="sb-act-btn" onclick="logout()">Sign out</button>
    </div>`;
  document.querySelectorAll('[data-nav]').forEach(b=>{b.onclick=()=>{S.section=b.dataset.nav;S.selProj=null;render();};});
  const fmb=document.getElementById('focus-mode-btn');
  if(fmb)fmb.onclick=()=>openFocusMode();
}

// ── TOPBAR ────────────────────────────────────────────────────
function renderTopbar(){
  const col=cc();
  const n=NAV_ITEMS.find(x=>x.id===S.section);
  document.getElementById('topbar-title').innerHTML=`<span style="color:${col}">${n?.label||''}</span>`;
  const acts=document.getElementById('topbar-actions');
  let html='';

      <div class="stat-grid">
        ${[{l:'Projects',v:S.projects.length,c:NAV_COLOR.projects},{l:'In Progress',v:S.projects.filter(p=>p.status==='in-progress').length,c:NAV_COLOR.tasks},{l:'At Risk',v:atR.length,c:NAV_COLOR.goals},{l:'Urgent Tasks',v:urg.length,c:'#f43f5e'},{l:'Goals Active',v:S.goals.length,c:NAV_COLOR.focus}].map(s=>`<div class="stat-card"><div class="stat-num" style="color:${s.c}">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join('')}

      ${wfT>0?`<div class="card" style="margin-bottom:18px;border-color:${NAV_COLOR.focus}22">
        <div class="flex-b" style="margin-bottom:14px"><div class="sl" style="margin-bottom:0;color:${NAV_COLOR.focus}">This Week's Focus</div><span style="font-size:12px;color:var(--t2)">${wfD}/${wfT} done</span></div>
        ${S.focus.slice(0,4).map(f=>`<div class="flex-g" style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div class="f-check ${f.done?'checked':''}" data-ft="${f.id}" style="${f.done?'':'border-color:var(--t3)'}">${f.done?bx('check',10,'#fff'):''}</div>

        <div class="card" style="${urg.length?'border-color:rgba(244,63,94,0.2)':''}">
          <div class="sl">Urgent Tasks</div>
          ${urg.length?urg.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(244,63,94,0.06);border:1px solid rgba(244,63,94,0.15);border-radius:9px;margin-bottom:7px;font-size:13px"><span class="pulse" style="width:6px;height:6px;border-radius:50%;background:#f43f5e;flex-shrink:0;display:inline-block"></span><span style="flex:1">${esc(t.text)}</span>${tag(t.tag||'UPDATE')}</div>`).join(''):'<div style="color:var(--t3);font-size:13px;padding:10px 0">No urgent tasks.</div>'}
        </div>
        <div class="card" style="${atR.length?'border-color:rgba(244,63,94,0.2)':''}">
          <div class="sl">Projects At Risk</div>
          ${atR.length?atR.map(p=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(244,63,94,0.06);border:1px solid rgba(244,63,94,0.15);border-radius:9px;margin-bottom:7px;font-size:13px"><span class="pulse" style="width:6px;height:6px;border-radius:50%;background:#f43f5e;flex-shrink:0;display:inline-block"></span><span style="flex:1">${esc(p.name)}</span><span style="font-size:10px;color:var(--t3)">${esc(p.vertical||'')}</span></div>`).join(''):'<div style="color:var(--t3);font-size:13px;padding:10px 0">All stable.</div>'}

      </div>
      <div class="card" style="margin-bottom:18px">

        <div class="sl">Recent Activity</div>

}

function vProjects(){

  return `<div class="fade-up">

function vProjectDetail(){
  const p=S.projects.find(x=>x.id===S.selProj);

  const hs=health(p),hcolor=hc(hs),pr=pprog(p.id),col=p.color||NAV_COLOR.projects;
  const tl=S.timeLogs.filter(l=>l.project_id===p.id);
  const totalT=tl.reduce((a,l)=>a+l.duration_seconds,0);
  return `<div class="fade-up">
    <div style="margin-bottom:22px">
      <div style="font-size:10px;color:${col};letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600">${esc(p.vertical||'')}</div>

      <div style="font-size:12px;color:var(--t3);font-family:monospace">${esc(p.url||'')}</div>
    </div>
    <div class="flex-g" style="margin-bottom:22px;flex-wrap:wrap">
      ${badge(p.status)}${pri(p.priority)}
      <span style="font-size:11px;color:${hcolor};background:${hcolor}12;padding:3px 10px;border-radius:20px;border:1px solid ${hcolor}25">Health ${hs}/100</span>
    </div>
    ${p.pinned_note?`<div class="pinned-note"><div class="pinned-note-label">📌 Pinned Note</div>${esc(p.pinned_note)}</div>`:''}
    <div class="grid-3" style="margin-bottom:22px">
      <div class="card"><div class="sl">Stack</div><div style="font-size:13px;color:var(--t2);line-height:1.7">${esc(p.stack||'Not specified')}</div></div>
      <div class="card"><div class="sl">Notes</div><div style="font-size:13px;color:var(--t2);line-height:1.7">${esc(p.notes||'No notes.')}</div></div>
      <div class="card"><div class="sl">Stats</div>
        <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:var(--c-tasks)">${totalT>0?Math.round(totalT/3600)+'h logged':'No time logged'}</div>
        ${pr!==null?`<div style="margin-top:12px"><div class="flex-b" style="margin-bottom:4px"><span style="font-size:11px;color:var(--t3)">Task completion</span><span style="font-size:11px;color:var(--t2)">${pr}%</span></div>${pbar(pr,col,4)}</div>`:''}
      </div>
    </div>
    <div class="sl">Task Board</div>
    <div class="kanban">
      ${TCOLS.map(col2=>{
        const cm=SM[col2],colT=pt.filter(t=>t.status===col2);
        return `<div class="k-col" data-col="${col2}">
          <div class="k-hdr"><span class="k-dot" style="background:${cm.c}"></span><span class="k-lbl" style="color:${cm.c}">${cm.l}</span><span class="k-cnt">${colT.length}</span></div>
          ${colT.length===0?'<div style="text-align:center;padding:24px 0;font-size:12px;color:var(--t3)">Empty</div>':''}
          ${colT.map(t=>`<div class="t-card" draggable="true" data-tc="${t.id}">
            ${t.recurring&&t.recurring!=='none'?`<span class="rec-tag">↻ ${t.recurring}</span><br>`:''}
            <div class="t-card-text">${esc(t.text)}</div>
            <div class="t-card-meta">${pri(t.priority)}<div class="flex-g" style="gap:5px">
              ${t.due_date?`<span style="font-size:10px;color:var(--t3)">${fd(t.due_date)}</span>`:''}
              <button class="icon-btn" style="padding:2px" title="Focus on this" data-focus-task="${esc(t.text)}">${bx('focus',11)}</button>
              <button class="icon-btn" data-et="${t.id}">${bx('edit',11)}</button>
              <button class="icon-btn del" data-dt="${t.id}">${bx('trash',11)}</button>
            </div></div>
            ${t.tag?`<div style="margin-top:8px">${tag(t.tag)}</div>`:''}

        </div>`;
      }).join('')}

  </div>`;

// ── RECURRING ─────────────────────────────────────────────────
async function handleRec(task){
  if(!task.recurring||task.recurring==='none')return;
  const nd=task.due_date?new Date(task.due_date+'T12:00:00'):new Date();
  if(task.recurring==='daily')nd.setDate(nd.getDate()+1);
  else if(task.recurring==='weekly')nd.setDate(nd.getDate()+7);
  else if(task.recurring==='monthly')nd.setMonth(nd.getMonth()+1);
  const r=await dbi('tasks',{text:task.text,project_id:task.project_id,status:'todo',priority:task.priority,tag:task.tag,estimate:task.estimate,due_date:nd.toISOString().split('T')[0],recurring:task.recurring});
  if(r){S.tasks.unshift(r);toast(`Recurring task recreated for ${fd(r.due_date)}`);}
}

// ── EVENT BINDING ─────────────────────────────────────────────
function bindEvents(){
  const m=document.getElementById('main-inner');
  if(!m)return;

  // Topbar
  const tb=document.getElementById('topbar-actions');
  if(tb){
    const tap=document.getElementById('tb-add-proj');if(tap)tap.onclick=()=>mProject();
    const tat=document.getElementById('tb-add-task');if(tat)tat.onclick=()=>mTask();
    const tatd=document.getElementById('tb-add-task-d');if(tatd)tatd.onclick=()=>mTask(null,S.selProj);
    const tag2=document.getElementById('tb-add-goal');if(tag2)tag2.onclick=()=>mGoal();
    const tai=document.getElementById('tb-add-infra');if(tai)tai.onclick=()=>mInfra();
    const tad=document.getElementById('tb-add-domain');if(tad)tad.onclick=()=>mDomain();
    const taf=document.getElementById('tb-add-focus');if(taf)taf.onclick=()=>mFocus();
    const tas=document.getElementById('tb-add-sd');if(tas)tas.onclick=()=>mSomeday();
    const tbk=document.getElementById('tb-back');if(tbk)tbk.onclick=()=>{S.selProj=null;render();};
    const tex=document.getElementById('tb-export');if(tex)tex.onclick=exportPDF;
  }

  // Filters
  m.querySelectorAll('[data-fv]').forEach(b=>{b.onclick=()=>{S.fV=b.dataset.fv;render();};});
  m.querySelectorAll('[data-fs]').forEach(b=>{b.onclick=()=>{S.fS=b.dataset.fs;render();};});
  m.querySelectorAll('[data-fp]').forEach(b=>{b.onclick=()=>{S.fP=b.dataset.fp;render();};});

  // Projects
  m.querySelectorAll('[data-pid]').forEach(c=>{c.onclick=e=>{if(e.target.closest('.icon-btn')||e.target.closest('.row-btns'))return;S.selProj=c.dataset.pid;render();};});

  // Focus task buttons
  m.querySelectorAll('[data-focus-task]').forEach(b=>{b.onclick=e=>{e.stopPropagation();openFocusMode(b.dataset.focusTask);};});

  // Edit
  m.querySelectorAll('[data-ep]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const p=S.projects.find(x=>x.id===b.dataset.ep);if(p)mProject(p);};});
  m.querySelectorAll('[data-et]').forEach(b=>{b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.et);if(t)mTask(t);};});
  m.querySelectorAll('[data-eg]').forEach(b=>{b.onclick=()=>{const g=S.goals.find(x=>x.id===b.dataset.eg);if(g)mGoal(g);};});
  m.querySelectorAll('[data-ei]').forEach(b=>{b.onclick=()=>{const i=S.infra.find(x=>x.id===b.dataset.ei);if(i)mInfra(i);};});
  m.querySelectorAll('[data-ed]').forEach(b=>{b.onclick=()=>{const d=S.domains.find(x=>x.id===b.dataset.ed);if(d)mDomain(d);};});

  // Delete
  m.querySelectorAll('[data-dp]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const id=b.dataset.dp;confirmDel('Delete this project and all its tasks?',async()=>{await dbd('projects',id);S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.project_id!==id);if(S.selProj===id)S.selProj=null;closeM();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-dt]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dt;confirmDel('Delete this task?',async()=>{await dbd('tasks',id);S.tasks=S.tasks.filter(t=>t.id!==id);closeM();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-dg]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dg;confirmDel('Delete this goal?',async()=>{await dbd('goals',id);S.goals=S.goals.filter(g=>g.id!==id);closeM();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-di]').forEach(b=>{b.onclick=()=>{const id=b.dataset.di;confirmDel('Delete this record?',async()=>{await dbd('infra',id);S.infra=S.infra.filter(i=>i.id!==id);closeM();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-dd]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dd;confirmDel('Delete this domain?',async()=>{await dbd('study_domains',id);S.domains=S.domains.filter(d=>d.id!==id);closeM();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-dl]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dl;confirmDel('Delete this entry?',async()=>{await dbd('logs',id);S.logs=S.logs.filter(l=>l.id!==id);closeM();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-df]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.df;await dbd('weekly_focus',id);S.focus=S.focus.filter(f=>f.id!==id);toast('Removed.');render();};});
  m.querySelectorAll('[data-ds]').forEach(b=>{b.onclick=()=>{const id=b.dataset.ds;confirmDel('Remove from parking lot?',async()=>{await dbd('someday',id);S.someday=S.someday.filter(s=>s.id!==id);closeM();toast('Removed.');render();});};});

  // Focus toggle
  m.querySelectorAll('[data-ft]').forEach(el=>{el.onclick=async()=>{const id=el.dataset.ft,f=S.focus.find(x=>x.id===id);if(!f)return;await dbu('weekly_focus',id,{done:!f.done});f.done=!f.done;render();};});

  // Someday to task
  m.querySelectorAll('[data-stot]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.stot,s=S.someday.find(x=>x.id===id);if(!s)return;const r=await dbi('tasks',{text:s.text,status:'todo',priority:'medium',tag:'UPDATE'});if(r){S.tasks.unshift(r);await dbd('someday',id);S.someday=S.someday.filter(x=>x.id!==id);toast('Moved to Tasks.');render();}};});

  // Drag and drop
  m.querySelectorAll('[data-tc]').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.tc;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
  m.querySelectorAll('.k-col[data-col]').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      if(!dragId)return;
      const ns=col.dataset.col,task=S.tasks.find(t=>t.id===dragId);
      if(!task||task.status===ns){dragId=null;return;}
      const wasDone=ns==='done'&&task.status!=='done';
      await dbu('tasks',dragId,{status:ns});task.status=ns;
      if(wasDone&&task.recurring&&task.recurring!=='none')await handleRec(task);
      dragId=null;render();
    });
  });

  // Log
  const lgb=document.getElementById('lg-btn');
  if(lgb){
    const doLog=async()=>{
      const text=document.getElementById('lg-text').value.trim(),tg=document.getElementById('lg-tag').value,proj=document.getElementById('lg-proj').value.trim();
      if(!text){toast('Enter something.');return;}
      lgb.textContent='Logging...';
      const r=await dbi('logs',{text,tag:tg,project:proj||null});
      if(r){S.logs.unshift(r);toast('Logged.');}
      lgb.textContent='Log it';render();
    };
    lgb.onclick=doLog;
    document.getElementById('lg-text').onkeydown=e=>{if(e.key==='Enter')doLog();};
  }

  // Settings toggles
  const td=document.getElementById('tog-density');if(td)td.onclick=()=>{S.settings.density=S.settings.density==='compact'?'comfortable':'compact';render();};
  const eb=document.getElementById('exp-btn');if(eb)eb.onclick=exportPDF;

  // Modal backdrop
  document.getElementById('modal-overlay').onclick=e=>{if(e.target===document.getElementById('modal-overlay'))closeM();};

  // Login
  const lb=document.getElementById('l-btn');
  if(lb){lb.onclick=login;document.getElementById('l-pass').onkeydown=e=>{if(e.key==='Enter')login();};}
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  setCC();
  renderSB();
  renderTopbar();
  let html='';
  if(S.section==='dashboard')     html=vDashboard();
  else if(S.section==='projects') html=S.selProj?vProjectDetail():vProjects();
  else if(S.section==='tasks')    html=vTasks();
  else if(S.section==='focus')    html=vFocus();
  else if(S.section==='goals')    html=vGoals();
  else if(S.section==='infra')    html=vInfra();
  else if(S.section==='study')    html=vStudy();
  else if(S.section==='someday')  html=vSomeday();
  else if(S.section==='log')      html=vLog();
  else if(S.section==='settings') html=vSettings();
  document.getElementById('main-inner').innerHTML=html;
  bindEvents();
}

// ── GLOBAL KEYS ───────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const tag2=document.activeElement.tagName;
  const typing=['INPUT','TEXTAREA','SELECT'].includes(tag2);
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();}
  if(e.key==='/'&&!typing){e.preventDefault();openQA();}
  if(e.key==='Escape'){closeSearch();closeQA();}
});
document.getElementById('sb-qa-btn').onclick=openQA;
document.getElementById('sb-search-btn').onclick=openSearch;
document.getElementById('search-overlay').onclick=e=>{if(e.target===document.getElementById('search-overlay'))closeSearch();};
document.getElementById('search-input').oninput=e=>runSearch(e.target.value);
document.getElementById('qa-back').onclick=closeQA;
document.getElementById('qa-submit').onclick=submitQA;
document.getElementById('qa-input').onkeydown=e=>{if(e.key==='Enter')submitQA();if(e.key==='Escape')closeQA();};
document.getElementById('fm-exit').onclick=closeFocusMode;
document.getElementById('fm-play').onclick=pomoStart;
document.getElementById('fm-reset').onclick=pomoReset;

// ── BOOT ──────────────────────────────────────────────────────
async function boot(){
  document.getElementById('loading').style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  await loadAll();
  render();
}

async function init(){
  const {data:{session}}=await db.auth.getSession();
  document.getElementById('loading').style.display='none';
  if(session){await boot();}
  else{document.getElementById('login-screen').style.display='flex';bindEvents();}
}

init();
</script>
</body>
</html>
