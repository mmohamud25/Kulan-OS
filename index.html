<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Kulan OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────────────────── */
:root{
  --bg:#08090e;--sf:#0e1018;--sf2:#14161f;--sf3:#1a1d28;
  --t1:#eceef5;--t2:#7880a0;--t3:#363d52;
  --bd:rgba(255,255,255,0.055);--bd2:rgba(255,255,255,0.1);
  --sh:0 2px 16px rgba(0,0,0,0.4);--sh2:0 8px 40px rgba(0,0,0,0.6);
  --r:8px;--r2:11px;--r3:15px;
  --acc:#5b8def;--fs:14px;--sbw:220px;
  /* Section accent colors */
  --c-d:#5b8def;--c-p:#22c55e;--c-t:#f59e0b;--c-f:#a78bfa;
  --c-g:#fb7185;--c-ca:#22d3ee;--c-i:#38bdf8;--c-st:#fb923c;
  --c-pk:#94a3b8;--c-l:#2dd4bf;--c-rv:#e879f9;--c-se:#64748b;
}
.th-light{--bg:#f0f1f5;--sf:#ffffff;--sf2:#f7f8fc;--sf3:#edeef5;--t1:#111218;--t2:#6470a0;--t3:#c8cce0;--bd:rgba(0,0,0,0.06);--bd2:rgba(0,0,0,0.11);--sh:0 2px 12px rgba(0,0,0,0.07);}
.th-dim{--bg:#0f1117;--sf:#161820;--sf2:#1c1f2a;--sf3:#222636;--t1:#d8daf0;--t2:#6870a0;--t3:#30364a;}
.th-warm{--bg:#0e0a07;--sf:#15110c;--sf2:#1c1710;--sf3:#231d15;--t1:#f0e8df;--t2:#8c7a68;--t3:#46372a;--bd:rgba(255,200,150,0.07);--acc:#e07a40;}
.th-green{--bg:#070f08;--sf:#0c1610;--sf2:#101d13;--sf3:#152417;--t1:#dff0e3;--t2:#6a9070;--t3:#2a4030;--bd:rgba(100,200,100,0.07);--acc:#2eb86a;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;font-size:var(--fs);background:var(--bg);color:var(--t1);line-height:1.55;transition:background 0.25s,color 0.25s;}
input,textarea,select{font-family:'Inter',sans-serif;font-size:var(--fs);outline:none;color:var(--t1);}
input::placeholder,textarea::placeholder{color:var(--t3);}
button{cursor:pointer;font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes briefIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.22s ease;}

/* ── LOADING ─────────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;}
.ld-wordmark{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-0.3px;}
.ld-ring{width:24px;height:24px;border:2px solid var(--sf3);border-top-color:var(--acc);border-radius:50%;animation:spin 0.7s linear infinite;}

/* ── LOGIN ───────────────────────────────────────────────── */
#login-screen{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;}
.lc{background:var(--sf);border:1px solid var(--bd2);border-radius:18px;padding:42px 38px;width:380px;max-width:92vw;animation:scaleIn 0.28s ease;box-shadow:var(--sh2);}
.lc-logo{display:flex;align-items:center;gap:9px;margin-bottom:24px;}
.lc-mark{width:34px;height:34px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;}
.lc-name{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.lc-sub{font-size:12px;color:var(--t3);}
.lc-h{font-size:20px;font-weight:700;margin-bottom:4px;}
.lc-s{font-size:13px;color:var(--t2);margin-bottom:28px;}
.lf{margin-bottom:14px;}
.lf label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;font-weight:500;letter-spacing:0.3px;}
.lfi{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;color:var(--t1);padding:10px 13px;transition:border-color 0.15s;}
.lfi:focus{border-color:var(--acc);}
.btn-login{width:100%;background:var(--acc);border:none;border-radius:9px;color:#fff;padding:12px;font-size:14px;font-weight:600;transition:opacity 0.15s;margin-top:4px;}
.btn-login:hover{opacity:0.88;}
.lerr{font-size:12px;color:#fb7185;margin-top:9px;text-align:center;min-height:16px;}

/* ── APP ─────────────────────────────────────────────────── */
#app{display:none;height:100vh;flex-direction:row;position:relative;}

/* ── SIDEBAR ─────────────────────────────────────────────── */
#sb{width:var(--sbw);background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;flex-shrink:0;transition:background 0.25s,transform 0.25s;}
/* Top brand */
.sb-brand{padding:16px 16px 12px;border-bottom:1px solid var(--bd);}
.sb-logo-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.sb-mark{width:28px;height:28px;border-radius:7px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;flex-shrink:0;}
.sb-wordmark{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:-0.2px;}
.sb-wordmark span{color:var(--t3);font-weight:400;font-size:11px;display:block;margin-top:1px;}
/* Quick add & search */
.sb-actions{display:flex;gap:6px;margin-top:2px;}
.sb-add{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:7px;border:1px solid var(--bd2);background:transparent;color:var(--t2);font-size:12px;font-weight:500;transition:all 0.13s;}
.sb-add:hover{background:var(--sf2);color:var(--t1);border-color:var(--bd2);}
.sb-add svg{opacity:0.6;}
.sb-search{width:30px;height:30px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--t3);display:flex;align-items:center;justify-content:center;transition:all 0.13s;}
.sb-search:hover{color:var(--t1);background:var(--sf2);}
/* Nav */
#sb-nav{flex:1;padding:8px 8px;overflow-y:auto;}
.n-sect{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;padding:10px 8px 4px;}
.ni{width:100%;display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;border:none;background:transparent;color:var(--t2);font-size:13px;font-weight:400;text-align:left;transition:all 0.12s;position:relative;margin-bottom:1px;}
.ni svg{flex-shrink:0;opacity:0.55;transition:opacity 0.12s;}
.ni:hover{background:var(--sf2);color:var(--t1);}
.ni:hover svg{opacity:0.8;}
.ni.act{color:var(--t1);background:var(--sf2);font-weight:500;}
.ni.act svg{opacity:1;}
.ni.act::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 2px 2px 0;background:var(--ni-c,var(--acc));}
.ni-badge{margin-left:auto;font-size:9px;font-weight:700;background:rgba(251,113,133,0.18);color:#fb7185;padding:1px 6px;border-radius:6px;}
/* Footer */
#sb-foot{padding:10px 12px;border-top:1px solid var(--bd);}
.sb-user{display:flex;align-items:center;gap:8px;padding:6px 4px;margin-bottom:6px;}
.sb-avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.sb-uname{font-size:12px;font-weight:500;flex:1;}
.sb-ustatus{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 3s infinite;flex-shrink:0;}
.sb-foot-btns{display:flex;gap:5px;}
.sb-fbt{flex:1;padding:6px 8px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--t3);font-size:11px;font-weight:500;transition:all 0.12s;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;}
.sb-fbt:hover{color:var(--t1);border-color:var(--bd2);background:var(--sf2);}

/* ── MOB OVERLAY ─────────────────────────────────────────── */
#sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:45;backdrop-filter:blur(3px);}
#sb-ov.show{display:block;}
@media(max-width:768px){
  #sb{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);z-index:46;box-shadow:var(--sh2);}
  #sb.mob{transform:translateX(0);}
  #app{flex-direction:column;}
  #mw{height:100vh;}
}

/* ── TOPBAR ──────────────────────────────────────────────── */
#topbar{height:52px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0;}
#mob-ham{display:none;background:none;border:none;color:var(--t2);padding:4px;border-radius:6px;}
@media(max-width:768px){#mob-ham{display:flex;align-items:center;}}
#tb-ttl{flex:1;font-size:14px;font-weight:600;color:var(--t1);}
#tb-acts{display:flex;gap:7px;align-items:center;}
/* Kula topbar button */
#kula-topbtn{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:9px;border:1px solid rgba(167,139,250,0.3);background:rgba(167,139,250,0.07);color:#a78bfa;font-size:12px;font-weight:600;transition:all 0.14s;white-space:nowrap;}
#kula-topbtn:hover{background:rgba(167,139,250,0.13);border-color:rgba(167,139,250,0.5);}
#kula-topbtn.on{background:rgba(167,139,250,0.15);border-color:#a78bfa;color:#c4b5fd;}
.kula-live{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:pulse 2.5s infinite;}

/* ── MAIN ────────────────────────────────────────────────── */
#mw{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#main{flex:1;overflow-y:auto;padding:22px 24px;}
@media(max-width:768px){#main{padding:14px;padding-bottom:76px;}}

/* ── KULA PANEL ──────────────────────────────────────────── */
#kula{position:fixed;top:0;right:-460px;width:460px;max-width:100vw;height:100vh;background:var(--sf);border-left:1px solid var(--bd2);display:flex;flex-direction:column;z-index:80;transition:right 0.28s cubic-bezier(0.4,0,0.2,1);box-shadow:-16px 0 48px rgba(0,0,0,0.5);}
#kula.on{right:0;}
@media(max-width:768px){#kula{width:100vw;border-left:none;}}
/* Header */
.kh{padding:14px 16px;border-bottom:1px solid var(--bd);flex-shrink:0;background:var(--sf);}
.kh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.kh-l{display:flex;align-items:center;gap:11px;}
.kh-av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(124,58,237,0.3);}
.kh-name{font-size:15px;font-weight:700;letter-spacing:-0.2px;}
.kh-sub{font-size:10px;color:var(--t3);}
.kh-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(167,139,250,0.1);color:#a78bfa;border:1px solid rgba(167,139,250,0.2);}
/* Morning briefing */
.k-brief{margin:12px 14px 0;padding:12px 14px;background:rgba(91,141,239,0.06);border:1px solid rgba(91,141,239,0.18);border-radius:10px;font-size:12.5px;color:var(--t2);line-height:1.65;animation:briefIn 0.3s ease;}
.k-brief-lbl{font-size:9px;font-weight:700;color:var(--acc);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.k-brief-text p{margin-bottom:5px;}
.k-brief-text p:last-child{margin-bottom:0;}
/* Messages */
#k-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;}
.km-user{display:flex;justify-content:flex-end;animation:msgIn 0.18s ease;}
.km-user .kb{background:var(--acc);color:#fff;border-radius:14px 14px 3px 14px;padding:9px 13px;font-size:13px;max-width:85%;line-height:1.5;word-wrap:break-word;}
.km-ai{display:flex;justify-content:flex-start;animation:msgIn 0.18s ease;}
.km-ai .kb{background:var(--sf2);border:1px solid var(--bd);border-radius:14px 14px 14px 3px;padding:10px 14px;font-size:13px;max-width:93%;line-height:1.65;word-wrap:break-word;}
.km-ai .kb p{margin-bottom:7px;}
.km-ai .kb p:last-child{margin-bottom:0;}
.km-ai .kb ul,.km-ai .kb ol{padding-left:17px;margin:5px 0;}
.km-ai .kb li{margin-bottom:3px;}
.km-ai .kb strong{color:var(--t1);font-weight:600;}
.km-ai .kb code{font-family:monospace;font-size:11.5px;background:rgba(128,128,128,0.12);padding:1px 5px;border-radius:4px;}
/* Mode tags */
.k-mode-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;margin-bottom:7px;letter-spacing:0.3px;}
/* Thinking */
.k-think{display:flex;gap:4px;align-items:center;padding:10px 13px;background:var(--sf2);border:1px solid var(--bd);border-radius:14px;width:fit-content;}
.kt{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:pulse 1.2s infinite;}
.kt:nth-child(2){animation-delay:0.2s;}
.kt:nth-child(3){animation-delay:0.4s;}
/* Action bar */
.k-act-bar{background:rgba(34,197,94,0.05);border:1px solid rgba(34,197,94,0.18);border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:9px;animation:msgIn 0.2s ease;margin-top:3px;}
.kab-t{font-size:12px;color:#4ade80;flex:1;line-height:1.4;}
.kab-do{padding:5px 12px;border-radius:7px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.1);color:#4ade80;font-size:11px;font-weight:600;transition:all 0.13s;}
.kab-do:hover{background:rgba(34,197,94,0.18);}
.kab-sk{padding:5px 9px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--t3);font-size:11px;}
/* Mode selector */
.k-modes{padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;}
.k-mode{padding:4px 10px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-size:11px;font-weight:500;transition:all 0.12s;}
.k-mode:hover{color:var(--t1);border-color:var(--bd2);}
.k-mode.active{border-color:rgba(167,139,250,0.5);color:#a78bfa;background:rgba(167,139,250,0.08);}
/* Footer */
.k-foot{padding:12px 14px;border-top:1px solid var(--bd);flex-shrink:0;}
.k-sugs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
.ks{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--t2);transition:all 0.12s;}
.ks:hover{border-color:rgba(167,139,250,0.4);color:#a78bfa;}
.k-in-row{display:flex;gap:7px;align-items:flex-end;}
#k-in{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--t1);padding:9px 12px;font-size:13px;resize:none;max-height:80px;line-height:1.5;transition:border-color 0.14s;}
#k-in:focus{border-color:#8b5cf6;}
#k-send{background:#8b5cf6;border:none;border-radius:9px;color:#fff;padding:9px 14px;font-size:13px;font-weight:600;transition:opacity 0.14s;white-space:nowrap;}
#k-send:hover{opacity:0.88;}
#k-send:disabled{opacity:0.4;cursor:not-allowed;}
.k-tools{display:flex;align-items:center;gap:8px;margin-top:7px;}
.k-tool-btn{background:none;border:none;color:var(--t3);padding:3px;border-radius:5px;transition:color 0.12s;display:flex;align-items:center;}
.k-tool-btn:hover{color:var(--t1);}
.k-tool-btn.active{color:#22c55e;}
.k-clr{font-size:10px;color:var(--t3);margin-left:auto;transition:color 0.12s;}
.k-clr:hover{color:var(--t2);}
/* Voice */
#voice-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--t3);display:flex;align-items:center;justify-content:center;transition:all 0.14s;}
#voice-btn:hover{color:var(--t1);}
#voice-btn.listening{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.4);color:#ef4444;animation:pulse 1s infinite;}
/* Mode labels */
.mode-chat{background:rgba(167,139,250,0.1);color:#a78bfa;border:1px solid rgba(167,139,250,0.2);}
.mode-study{background:rgba(251,146,60,0.1);color:#fb923c;border:1px solid rgba(251,146,60,0.2);}
.mode-job{background:rgba(34,211,238,0.1);color:#22d3ee;border:1px solid rgba(34,211,238,0.2);}
.mode-quiz{background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.2);}

/* ── SHARED ──────────────────────────────────────────────── */
.sl{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:11px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r3);padding:18px 20px;transition:background 0.25s;}
.bdg{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;white-space:nowrap;}
.pb-w{border-radius:10px;overflow:hidden;background:rgba(255,255,255,0.05);}
.pb-f{height:100%;border-radius:10px;}
.fb{display:flex;justify-content:space-between;align-items:center;}
.fg{display:flex;align-items:center;gap:7px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.es{text-align:center;padding:48px 20px;}
.es-ico{font-size:36px;margin-bottom:12px;}
.es-ttl{font-size:17px;font-weight:700;margin-bottom:5px;}
.es-sub{font-size:12px;color:var(--t3);}
@media(max-width:768px){.g2,.g3{grid-template-columns:1fr;}.g5{grid-template-columns:repeat(2,1fr);}}

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn{padding:7px 15px;border-radius:8px;border:none;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:all 0.13s;white-space:nowrap;}
.btn-g{background:transparent;border:1px solid var(--bd);color:var(--t2);}
.btn-g:hover{color:var(--t1);border-color:var(--bd2);background:var(--sf2);}
.btn-d{background:rgba(251,113,133,0.08);border:1px solid rgba(251,113,133,0.2);color:#fb7185;}
.btn-d:hover{background:rgba(251,113,133,0.15);}
.btn-c{color:#fff;}
.btn-c:hover{opacity:0.88;}
.ibtn{background:none;border:none;padding:4px;color:var(--t3);display:inline-flex;align-items:center;border-radius:5px;transition:all 0.12s;}
.ibtn:hover{color:var(--t1);background:rgba(255,255,255,0.07);}
.ibtn.del:hover{color:#fb7185;background:rgba(251,113,133,0.1);}
.rbtns{display:flex;gap:2px;opacity:0;transition:opacity 0.12s;}
.card:hover .rbtns,.pc:hover .rbtns,.tc:hover .rbtns,.jc:hover .rbtns{opacity:1;}

/* ── FILTERS ─────────────────────────────────────────────── */
.frow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.flbl{font-size:9px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-right:2px;font-weight:700;}
.fbtn{padding:4px 11px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-size:11px;transition:all 0.12s;}
.fbtn.act{border-color:var(--acc);color:var(--acc);background:rgba(91,141,239,0.06);}
.fbtn:hover:not(.act){color:var(--t1);}

/* ── PROJECT CARDS ───────────────────────────────────────── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px;}
.pc{background:var(--sf);border-radius:var(--r3);padding:18px;cursor:pointer;transition:all 0.17s;position:relative;overflow:hidden;border:1px solid var(--bd);}
.pc:hover{transform:translateY(-1px);box-shadow:var(--sh2);border-color:var(--bd2);}
.pc-glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;pointer-events:none;opacity:0.14;}
.pc-vert{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;font-weight:700;}
.pc-name{font-size:15px;font-weight:700;margin-bottom:11px;line-height:1.3;letter-spacing:-0.2px;}
.hdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;cursor:help;}
@media(max-width:768px){.pgrid{grid-template-columns:1fr;}}

/* ── KANBAN ──────────────────────────────────────────────── */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
.kcol{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:12px;min-height:180px;transition:border-color 0.13s;}
.kcol.dov{border-color:var(--acc);}
.khdr{display:flex;align-items:center;gap:7px;margin-bottom:11px;}
.kdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.klbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.kcnt{margin-left:auto;font-size:10px;color:var(--t3);background:rgba(255,255,255,0.05);padding:1px 7px;border-radius:7px;}
.tc{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:10px 11px;margin-bottom:8px;cursor:grab;transition:all 0.13s;}
.tc:active{cursor:grabbing;}
.tc.dragging{opacity:0.28;}
.tc-proj{font-size:9px;font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.4px;}
.tc-txt{font-size:13px;line-height:1.45;margin-bottom:8px;font-weight:400;}
.ppill{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
.ppip{width:4px;height:4px;border-radius:50%;}
.tpill{font-size:8px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:1px;text-transform:uppercase;}
.rec-b{font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(59,130,246,0.1);color:#60a5fa;margin-bottom:5px;display:inline-block;}
@media(max-width:768px){.kanban{grid-template-columns:repeat(2,1fr);}}

/* ── STAT CARDS ──────────────────────────────────────────── */
.scard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:14px 16px;}
.snum{font-size:26px;font-weight:800;line-height:1;margin-bottom:3px;letter-spacing:-0.5px;}
.slbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}

/* ── JOB CARDS ───────────────────────────────────────────── */
.jc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);padding:15px 17px;transition:all 0.14s;}
.jc:hover{border-color:var(--bd2);}
.jc-co{font-size:14px;font-weight:700;margin-bottom:2px;letter-spacing:-0.1px;}
.jc-role{font-size:12px;color:var(--t2);}
.js-stat{padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;}
.js-pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:18px;}
@media(max-width:768px){.js-pipe{grid-template-columns:repeat(3,1fr);}}
.jsp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 8px;text-align:center;}
.jsp-n{font-size:20px;font-weight:800;line-height:1;margin-bottom:2px;}
.jsp-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}

/* ── FOCUS ITEMS ─────────────────────────────────────────── */
.fitem{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:7px;transition:opacity 0.18s;}
.fitem.done{opacity:0.38;}
.fchk{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--t3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.14s;margin-top:2px;}
.fchk.chk{background:#8b5cf6;border-color:#8b5cf6;}

/* ── SMART SUGGESTION ────────────────────────────────────── */
.smart-sug{background:rgba(91,141,239,0.05);border:1px solid rgba(91,141,239,0.15);border-radius:var(--r2);padding:12px 15px;margin-bottom:14px;}
.smart-sug-lbl{font-size:9px;font-weight:700;color:var(--acc);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.smart-sug-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px;color:var(--t2);}
.smart-sug-item:last-child{border-bottom:none;padding-bottom:0;}
.smart-sug-item span{flex:1;}
.smart-sug-item .days{font-size:10px;color:var(--acc);font-weight:600;flex-shrink:0;}

/* ── QUIZ ────────────────────────────────────────────────── */
.quiz-card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r2);padding:16px;margin-bottom:10px;animation:msgIn 0.2s ease;}
.quiz-q{font-size:14px;font-weight:600;margin-bottom:12px;line-height:1.5;}
.quiz-opts{display:flex;flex-direction:column;gap:7px;}
.quiz-opt{padding:10px 13px;border:1px solid var(--bd);border-radius:var(--r);background:transparent;color:var(--t1);font-size:13px;text-align:left;transition:all 0.13s;}
.quiz-opt:hover{border-color:var(--bd2);background:var(--sf3);}
.quiz-opt.correct{border-color:#22c55e;background:rgba(34,197,94,0.08);color:#4ade80;}
.quiz-opt.wrong{border-color:#fb7185;background:rgba(251,113,133,0.08);color:#fda4af;}

/* ── SEARCH ──────────────────────────────────────────────── */
#so{display:none;position:fixed;inset:0;z-index:200;align-items:flex-start;justify-content:center;padding-top:90px;background:rgba(0,0,0,0.72);backdrop-filter:blur(6px);}
#so.show{display:flex;}
.sb4{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r3);width:540px;max-width:92vw;overflow:hidden;box-shadow:var(--sh2);animation:scaleIn 0.17s ease;}
.si-w{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--bd);}
#si{flex:1;background:transparent;border:none;color:var(--t1);font-size:15px;}
.sres{max-height:320px;overflow-y:auto;padding:6px;}
.sri{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:7px;cursor:pointer;transition:background 0.1s;}
.sri:hover{background:var(--sf2);}
.srtype{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;width:48px;flex-shrink:0;}

/* ── QUICK ADD ───────────────────────────────────────────── */
#qao{display:none;position:fixed;inset:0;z-index:180;align-items:flex-start;justify-content:center;padding-top:110px;}
#qao.show{display:flex;}
.qa-bg{position:absolute;inset:0;background:rgba(0,0,0,0.62);backdrop-filter:blur(4px);}
.qa-bx{position:relative;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r3);padding:16px 18px;width:520px;max-width:92vw;box-shadow:var(--sh2);animation:fadeUp 0.17s ease;}
.qa-hint{font-size:10px;color:var(--t3);margin-bottom:8px;}
#qa-in{width:100%;background:transparent;border:none;color:var(--t1);font-size:15px;padding:0;margin-bottom:11px;}
.qsel{background:var(--sf2);border:1px solid var(--bd);border-radius:7px;color:var(--t2);padding:5px 10px;font-size:11px;}

/* ── MODAL ───────────────────────────────────────────────── */
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(6px);z-index:150;align-items:center;justify-content:center;padding:14px;}
#mo.show{display:flex;}
.mdl{background:var(--sf);border:1px solid var(--bd2);border-radius:18px;padding:26px 28px;width:480px;max-width:100%;max-height:88vh;overflow-y:auto;animation:scaleIn 0.2s ease;box-shadow:var(--sh2);}
.mtitle{font-size:19px;font-weight:700;margin-bottom:20px;letter-spacing:-0.2px;}
.mg2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
@media(max-width:480px){.mg2{grid-template-columns:1fr;}}
.mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;padding-top:15px;border-top:1px solid var(--bd);}
.fl2{margin-bottom:12px;}
.fl2 label{display:block;font-size:10px;color:var(--t2);margin-bottom:5px;font-weight:600;letter-spacing:0.3px;}
.fi2{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--t1);padding:9px 12px;transition:border-color 0.14s;font-size:13px;}
.fi2:focus{border-color:var(--acc);}
textarea.fi2{resize:vertical;min-height:72px;}
select.fi2{cursor:pointer;}

/* ── FOCUS MODE ──────────────────────────────────────────── */
#fm{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;}
#fm.show{display:flex;}
.fm-l{font-size:10px;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:9px;}
.fm-t{font-size:22px;font-weight:700;max-width:540px;text-align:center;line-height:1.35;margin-bottom:26px;letter-spacing:-0.2px;}
.fm-time{font-size:72px;font-weight:800;letter-spacing:-3px;line-height:1;margin-bottom:24px;}
.fm-btns{display:flex;gap:9px;}
.fm-btn{padding:11px 26px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--t1);font-size:13px;font-weight:600;transition:all 0.14s;}
.fm-btn.p{border-color:#8b5cf6;background:#8b5cf6;color:#fff;}
.fm-btn:hover:not(.p){border-color:var(--bd2);}
.fm-x{position:fixed;top:18px;right:18px;background:none;border:1px solid var(--bd);border-radius:7px;color:var(--t3);font-size:11px;padding:5px 11px;}
.fm-x:hover{color:var(--t1);}
.fm-s{font-size:11px;color:var(--t3);margin-top:16px;}

/* ── SETTINGS ────────────────────────────────────────────── */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:768px){.set-grid{grid-template-columns:1fr;}}
.set-c{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r3);padding:18px 20px;}
.set-ct{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-0.1px;}
.set-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.srow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);}
.srow:last-child{border-bottom:none;}
.srlbl{font-size:13px;font-weight:500;margin-bottom:2px;}
.srsub{font-size:11px;color:var(--t3);}
.theme-g{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:3px;}
.th-o{border-radius:8px;border:2px solid transparent;overflow:hidden;transition:all 0.14s;padding:0;}
.th-o.sel{border-color:var(--acc);}
.th-sw{height:40px;display:flex;align-items:flex-end;padding:5px;}
.th-nm{font-size:9px;font-weight:600;text-align:center;padding:5px 3px 7px;font-family:'Inter',sans-serif;}
.fs-btns{display:flex;gap:5px;}
.fsb{padding:5px 12px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-size:11px;font-weight:500;transition:all 0.13s;}
.fsb.act{border-color:var(--acc);color:var(--acc);background:rgba(91,141,239,0.07);}
.fsb:hover:not(.act){color:var(--t1);}
.kbd{background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--t3);font-family:monospace;}
.stat-chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(91,141,239,0.08);color:var(--acc);border:1px solid rgba(91,141,239,0.2);}

/* ── PINNED ──────────────────────────────────────────────── */
.pinned{background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.16);border-radius:var(--r);padding:11px 14px;margin-bottom:15px;}
.plbl{font-size:9px;font-weight:700;color:#f59e0b;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}

/* ── REVIEW ──────────────────────────────────────────────── */
.rv-a{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--t1);padding:10px 12px;font-size:13px;resize:vertical;min-height:72px;transition:border-color 0.14s;}
.rv-a:focus{border-color:var(--acc);}
.rv-c{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r2);padding:13px;margin-bottom:9px;}

/* ── SOMEDAY ─────────────────────────────────────────────── */
.sdi{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:6px;}

/* ── ALERT BAR ───────────────────────────────────────────── */
.abar{background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.16);border-radius:var(--r2);padding:11px 15px;margin-bottom:15px;display:flex;gap:11px;}

/* ── TEMPLATE CARDS ──────────────────────────────────────── */
.tpl-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px;}
.tpl-c{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:11px 12px;transition:all 0.13s;}
.tpl-c:hover,.tpl-c.sel{border-color:var(--acc);}
.tpl-c.sel{background:rgba(91,141,239,0.06);}
.tpl-n{font-size:12px;font-weight:600;margin-bottom:2px;}
.tpl-d{font-size:10px;color:var(--t3);}

/* ── BOT NAV ─────────────────────────────────────────────── */
#bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--sf);border-top:1px solid var(--bd);z-index:40;padding:0 6px;align-items:center;justify-content:space-around;}
@media(max-width:768px){#bnav{display:flex;}}
.bni{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:9px;border:none;background:transparent;color:var(--t3);font-size:9px;font-weight:600;letter-spacing:0.4px;transition:all 0.13s;flex:1;}
.bni svg{opacity:0.5;transition:opacity 0.13s;}
.bni.act{color:var(--acc);}
.bni.act svg{opacity:1;}

/* ── TOAST ───────────────────────────────────────────────── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r2);padding:9px 18px;font-size:12px;color:var(--t1);opacity:0;transition:all 0.2s;z-index:400;pointer-events:none;white-space:nowrap;box-shadow:var(--sh2);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.e{border-color:rgba(251,113,133,0.4);color:#fda4af;}
@media(max-width:768px){#toast{bottom:76px;}}

/* SVG ICONS */
svg{display:block;}
</style>
</head>

</div>

      <div class="lc-mark">K</div>

<!-- Focus Mode -->

  <button class="fm-x" id="fm-x">✕ Exit</button>

  <div class="sb4">
    <div class="si-w">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="si" placeholder="Search projects, tasks, goals, jobs..." autocomplete="off">
      <span style="font-size:10px;color:var(--t3)">Esc</span>

  <div class="qa-bx">
    <div class="qa-hint">Press <span class="kbd">/</span> anywhere · Enter to save · Esc to close</div>

    <div class="fg" style="flex-wrap:wrap;gap:6px">

// ── HEALTH ───────────────────────────────────────────────────
function health(p){
  let s=100;
  if(p.status==='at-risk')s-=30;
  const pt=S.tasks.filter(t=>t.project_id===p.id);
  s-=pt.filter(t=>t.priority==='urgent'&&t.status!=='done').length*15;
  s-=pt.filter(t=>t.due_date&&t.status!=='done'&&new Date(t.due_date+'T12:00:00')<new Date()).length*10;
  if(S.infra.find(i=>i.project===p.name&&i.status==='at-risk'))s-=20;
  if(S.logs.find(l=>l.project===p.name&&new Date(l.created_at)>new Date(Date.now()-7*864e5)))s+=10;
  return Math.max(0,Math.min(100,s));
}
const hc=s=>s>=80?'#22c55e':s>=60?'#f59e0b':s>=40?'#fb923c':'#fb7185';
const pprog=id=>{const t=S.tasks.filter(x=>x.project_id===id);if(!t.length)return null;return Math.round(t.filter(x=>x.status==='done').length/t.length*100);};
function alerts(){
  const now=new Date(),soon=new Date(now.getTime()+7*864e5),out=[];
  S.goals.filter(g=>g.deadline&&new Date(g.deadline+'T12:00:00')>=now&&new Date(g.deadline+'T12:00:00')<=soon).forEach(g=>out.push({name:g.name,date:g.deadline,type:'Goal'}));
  S.tasks.filter(t=>t.status!=='done'&&t.due_date&&new Date(t.due_date+'T12:00:00')>=now&&new Date(t.due_date+'T12:00:00')<=soon).forEach(t=>out.push({name:t.text,date:t.due_date,type:'Task'}));
  return out;
}
function calcStreak(){
  if(!S.logs.length)return 0;
  const days=new Set(S.logs.map(l=>new Date(l.created_at).toDateString()));
  let streak=0,d=new Date();
  while(days.has(d.toDateString())){streak++;d.setDate(d.getDate()-1);}
  return streak;
}
// Smart suggestions — tasks stale 3+ days
function smartSuggestions(){
  const now=Date.now(),stale=[];
  S.tasks.filter(t=>t.status==='todo'&&t.status!=='done').forEach(t=>{
    const age=Math.floor((now-new Date(t.created_at).getTime())/864e5);
    if(age>=3)stale.push({...t,age});
  });
  return stale.sort((a,b)=>b.age-a.age).slice(0,3);
}

// ── RICH CONTEXT ─────────────────────────────────────────────
function buildCtx(){
  const now=new Date();
  const overdue=S.tasks.filter(t=>t.status!=='done'&&t.due_date&&new Date(t.due_date+'T12:00:00')<now);
  const dueSoon=S.tasks.filter(t=>t.status!=='done'&&t.due_date&&new Date(t.due_date+'T12:00:00')>=now&&new Date(t.due_date+'T12:00:00')<=new Date(now.getTime()+7*864e5));
  const urg=S.tasks.filter(t=>t.priority==='urgent'&&t.status!=='done');
  const streak=calcStreak();
  let ctx=`=== PROJECTS ===\n`;
  S.projects.forEach(p=>{const hs=health(p),pr=pprog(p.id),pt=S.tasks.filter(t=>t.project_id===p.id&&t.status!=='done');ctx+=`• ${p.name} | ${p.vertical||''} | ${p.status} | health:${hs}${pr!==null?` | ${pr}%`:''}${pt.length?` | ${pt.length} open tasks`:''}\n`;if(p.pinned_note)ctx+=`  📌 ${p.pinned_note}\n`;});
  ctx+=`\n=== URGENT ===\n`;urg.forEach(t=>ctx+=`• ${t.text}${pn(t.project_id)?' ['+pn(t.project_id)+']':''}\n`);
  ctx+=`\n=== IN PROGRESS ===\n`;S.tasks.filter(t=>t.status==='in-progress').forEach(t=>ctx+=`• ${t.text}${pn(t.project_id)?' ['+pn(t.project_id)+']':''}\n`);
  if(overdue.length){ctx+=`\n=== OVERDUE ===\n`;overdue.forEach(t=>ctx+=`• ${t.text} — due ${fd(t.due_date)}\n`);}
  if(dueSoon.length){ctx+=`\n=== DUE THIS WEEK ===\n`;dueSoon.forEach(t=>ctx+=`• ${t.text} — ${fd(t.due_date)}\n`);}
  ctx+=`\n=== GOALS ===\n`;S.goals.forEach(g=>ctx+=`• ${g.name} | ${g.progress||0}% | ${g.deadline||'no date'} | id:${g.id}\n`);
  ctx+=`\n=== WEEKLY FOCUS (${S.focus.filter(f=>f.done).length}/${S.focus.length}) ===\n`;S.focus.forEach(f=>ctx+=`• [${f.done?'✓':'○'}] ${f.text}\n`);
  ctx+=`\n=== STUDY ===\n`;const certs=[...new Set(S.domains.map(d=>d.cert).filter(Boolean))];certs.forEach(cert=>{const cd=S.domains.filter(d=>d.cert===cert);const avg=Math.round(cd.reduce((a,d)=>a+(d.progress||0),0)/cd.length);ctx+=`${cert}: ${avg}% overall\n`;cd.forEach(d=>ctx+=`  ${d.name}: ${d.progress||0}% (${d.total||0} topics)\n`);});
  ctx+=`\n=== JOB SEARCH (${S.jobs.length} apps) ===\n`;const jbs={};S.jobs.forEach(j=>{if(!jbs[j.status])jbs[j.status]=[];jbs[j.status].push(j.company);});Object.entries(jbs).forEach(([s,cs])=>ctx+=`${s}: ${cs.join(', ')}\n`);S.jobs.filter(j=>j.next_step).slice(0,5).forEach(j=>ctx+=`  → ${j.company}: ${j.next_step}\n`);
  ctx+=`\n=== STATS ===\n`;ctx+=`Streak: ${streak} days | Open tasks: ${S.tasks.filter(t=>t.status!=='done').length} | At-risk: ${S.projects.filter(p=>p.status==='at-risk').map(p=>p.name).join(', ')||'none'}\n`;
  ctx+=`\n=== IDs ===\n`;S.projects.forEach(p=>ctx+=`${p.name}: ${p.id}\n`);S.goals.forEach(g=>ctx+=`goal:${g.name}: ${g.id}\n`);
  return ctx;
}

// ── MORNING BRIEFING ─────────────────────────────────────────
async function generateBriefing(){
  const ba=document.getElementById('k-brief-area');
  if(!ba||briefDone)return;
  briefDone=true;
  ba.innerHTML=`<div class="k-brief"><div class="k-brief-lbl">☀️ Morning Briefing</div><div class="k-brief-text" style="color:var(--t3);font-size:11px">Generating...</div></div>`;
  try{
    const h=new Date().getHours();
    const prompt=h<12?'Give me a crisp morning briefing':'Give me a quick status check';
    const resp=await fetch(AIURL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SKEY}`},body:JSON.stringify({messages:[{role:'user',content:`${prompt} for today. Keep it under 80 words. 3 bullet points max: what's most urgent, what's due soon, and one priority recommendation. Be direct.`}],context:buildCtx()})});
    const data=await resp.json();
    if(data.content&&data.content[0]){
      const text=data.content[0].text.replace(/<action>[\s\S]*?<\/action>/g,'').trim();
      const fmt=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^[•\-]\s/gm,'').split('\n').filter(l=>l.trim()).map(l=>`<p>${l.trim()}</p>`).join('');
      ba.innerHTML=`<div class="k-brief"><div class="k-brief-lbl">☀️ Morning Briefing</div><div class="k-brief-text">${fmt}</div></div>`;
    } else {ba.innerHTML='';}
  }catch{ba.innerHTML='';}
}

function fmtAI(text){
  const clean=text.replace(/<action>[\s\S]*?<\/action>/g,'').trim();
  return clean
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .split('\n').map(l=>{
      l=l.trim();if(!l)return '';
      if(/^[\-•]\s/.test(l))return `<li>${l.replace(/^[\-•]\s/,'')}</li>`;
      if(/^\d+\.\s/.test(l))return `<li>${l.replace(/^\d+\.\s/,'')}</li>`;
      return `<p>${l}</p>`;
    }).join('').replace(/(<li>[\s\S]*?<\/li>)+/g,m=>`<ul>${m}</ul>`);
}

// Quiz mode handler
function handleQuizResponse(text){
  const box=document.getElementById('k-msgs');
  // Check if AI returned a quiz format
  const lines=text.replace(/<action>[\s\S]*?<\/action>/g,'').trim().split('\n').filter(l=>l.trim());
  const qLine=lines.find(l=>/^\d+\.|^Q:|question/i.test(l));
  if(!qLine){addKMsg('ai',text);return;}
  // Parse question and options
  const opts=lines.filter(l=>/^[A-D]\)|^[A-D]\./i.test(l.trim()));
  if(opts.length>=2){
    const qText=lines.slice(0,lines.indexOf(qLine)+1).join('\n');
    const div=document.createElement('div');div.className='km-ai';
    div.innerHTML=`<div class="quiz-card"><div class="quiz-q">${esc(qText.replace(/^\d+\.\s*/,''))}</div><div class="quiz-opts">${opts.map((o,i)=>`<button class="quiz-opt" data-qi="${i}">${esc(o)}</button>`).join('')}</div></div>`;
    box.appendChild(div);box.scrollTop=box.scrollHeight;
    div.querySelectorAll('.quiz-opt').forEach(b=>{b.onclick=()=>{div.querySelectorAll('.quiz-opt').forEach(x=>x.disabled=true);b.classList.add('correct');setTimeout(()=>sendKula('I answered: '+b.textContent+'. Was I correct? Explain the answer briefly.'),300);};});
  } else {addKMsg('ai',text);}
}

async function sendKula(text){
  if(!text.trim())return;
  const inp=document.getElementById('k-in');
  const btn=document.getElementById('k-send');
  const sugs=document.getElementById('k-sugs');
  inp.value='';btn.disabled=true;
  if(sugs)sugs.style.display='none';
  addKMsg('user',text);
  showKThink();

  // Build system context hint based on mode
  const modeHint={
    chat:'',
    job:'\n\nCurrent mode: JOB COACHING. Focus on giving Muzz specific, actionable interview prep and job search coaching based on his actual background (WGU MS Cybersecurity, CompTIA Security+ SY0-701 in progress, Desktop Technician at Franklin University, Security Officer at Allied Universal, Founder of Kulan Institute). Target roles: SOC Analyst and IT Security Analyst in Columbus OH.',
    study:'\n\nCurrent mode: STUDY MODE. Act as a cybersecurity study coach. Give clear, structured explanations of security concepts. Reference the specific domains and topics in his study tracker. Suggest what to study next based on his progress.',
    quiz:'\n\nCurrent mode: QUIZ MODE. Generate 1-3 practice questions in multiple choice format (A, B, C, D). Format each question clearly with the question on its own line, then options labeled A), B), C), D). After the user answers, explain why the correct answer is correct.',
  };

  try{
    const msgs=kHistory.slice(-20).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text+(m===kHistory[kHistory.length-1]&&kMode!=='chat'?modeHint[kMode]||'':'')}));
    msgs[msgs.length-1]={role:'user',content:text+(kMode!=='chat'?modeHint[kMode]||'':'')};
    const resp=await fetch(AIURL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SKEY}`},body:JSON.stringify({messages:msgs,context:buildCtx()})});
    const data=await resp.json();
    hideKThink();
    if(data.content&&data.content[0]){
      const reply=data.content[0].text;
      if(kMode==='quiz'){handleQuizResponse(reply);}
      else{addKMsg('ai',reply);}
      const action=parseAction(reply);
      if(action)showActBar(action,descAct(action));
      const mem=document.getElementById('k-mem');
      if(mem&&kHistory.length>4)mem.style.display='inline';
    } else if(data.error){addKMsg('ai',`Error: ${data.error}`);}
  }catch(e){hideKThink();addKMsg('ai','Could not reach Kula. Check that the Edge Function is deployed.');}
  btn.disabled=false;
}

function initVoice(){
  const btn=document.getElementById('voice-btn');
  if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){
    btn.title='Voice input not supported in this browser';btn.style.opacity='0.3';return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  voiceRec=new SR();
  voiceRec.continuous=false;voiceRec.interimResults=false;voiceRec.lang='en-US';
  voiceRec.onresult=e=>{
    const t=e.results[0][0].transcript;
    document.getElementById('k-in').value=t;
    stopVoice();
    setTimeout(()=>sendKula(t),200);
  };
  voiceRec.onerror=()=>stopVoice();
  voiceRec.onend=()=>stopVoice();
  btn.onclick=()=>{voiceActive?stopVoice():startVoice();};
}
function startVoice(){
  if(!voiceRec)return;
  voiceActive=true;
  document.getElementById('voice-btn').classList.add('listening');
  document.getElementById('voice-btn').title='Listening... click to stop';
  voiceRec.start();
}
function stopVoice(){
  voiceActive=false;
  const btn=document.getElementById('voice-btn');
  btn.classList.remove('listening');
  btn.title='Voice input';
  try{voiceRec&&voiceRec.stop();}catch{}
}

function runSearch(q){

  S.tasks.filter(t=>t.text.toLowerCase().includes(ql)).forEach(t=>res.push({type:'Task',color:NCH.tasks,text:t.text,sub:pn(t.project_id),act:()=>{S.section='tasks';closeSearch();render();}}));
  S.jobs.filter(j=>j.company.toLowerCase().includes(ql)).forEach(j=>res.push({type:'Job',color:NCH.career,text:j.company,sub:j.role||'',act:()=>{S.section='career';closeSearch();render();}}));
  S.goals.filter(g=>g.name.toLowerCase().includes(ql)).forEach(g=>res.push({type:'Goal',color:NCH.goals,text:g.name,sub:`${g.progress||0}%`,act:()=>{S.section='goals';closeSearch();render();}}));

  const rd=document.getElementById('sres');

// ── RECURRING ─────────────────────────────────────────────────
async function handleRec(task){
  if(!isRec(task))return;
  const nd=task.due_date?new Date(task.due_date+'T12:00:00'):new Date();
  if(task.recurring==='daily')nd.setDate(nd.getDate()+1);
  else if(task.recurring==='weekly')nd.setDate(nd.getDate()+7);
  else if(task.recurring==='monthly')nd.setMonth(nd.getMonth()+1);
  const r=await dbi('tasks',{text:task.text,project_id:task.project_id,status:'todo',priority:task.priority,tag:task.tag,estimate:task.estimate,due_date:nd.toISOString().split('T')[0],recurring:task.recurring});
  if(r){S.tasks.unshift(r);toast(`↻ Recreated for ${fd(r.due_date)}`);}
}

    <div class="fl2"><label>Pinned Note</label><textarea id="m-pin" class="fi2" placeholder="Current blocker or next step...">${esc(e?.pinned_note||'')}</textarea></div>
    ${mF()}`);
  if(!e){document.querySelectorAll('[data-tpl]').forEach(c=>{c.onclick=()=>{document.querySelectorAll('[data-tpl]').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');selTpl=TEMPLATES.find(t=>t.id===c.dataset.tpl);};});}
  document.getElementById('m-ok').onclick=async()=>{
    const name=document.getElementById('m-name').value.trim();
    if(!name){toast('Name required.',true);return;}
    const btn=document.getElementById('m-ok');btn.disabled=true;btn.textContent='Saving...';
    const d={name,vertical:document.getElementById('m-vert').value,status:document.getElementById('m-st').value,priority:document.getElementById('m-pri').value,color:document.getElementById('m-col').value,url:document.getElementById('m-url').value.trim(),stack:document.getElementById('m-stack').value.trim(),notes:document.getElementById('m-notes').value.trim(),pinned_note:document.getElementById('m-pin').value.trim()||null};

// ── EVENT BINDING ─────────────────────────────────────────────
function bindEvents(){
  const mi=document.getElementById('mi');if(!mi)return;
  const g=id=>document.getElementById(id);

  // Topbar buttons
  const tap=g('tb-ap');   if(tap)tap.onclick=()=>mProject();
  const tat=g('tb-at');   if(tat)tat.onclick=()=>mTask();
  const tatd=g('tb-atd'); if(tatd)tatd.onclick=()=>mTask(null,S.selProj);
  const tag=g('tb-ag');   if(tag)tag.onclick=()=>mGoal();
  const tai=g('tb-ai2');  if(tai)tai.onclick=()=>mInfra();
  const tad=g('tb-ad');   if(tad)tad.onclick=()=>mDomain();
  const taf=g('tb-af');   if(taf)taf.onclick=()=>mFocus();
  const tas=g('tb-as');   if(tas)tas.onclick=()=>mSomeday();
  const tar=g('tb-ar');   if(tar)tar.onclick=()=>mReview();
  const taj=g('tb-aj');   if(taj)taj.onclick=()=>mJob();
  const tbk=g('tb-bk');   if(tbk)tbk.onclick=()=>{S.selProj=null;render();};

  // Filters
  mi.querySelectorAll('[data-fv]').forEach(b=>{b.onclick=()=>{S.fV=b.dataset.fv;render();};});
  mi.querySelectorAll('[data-fs2]').forEach(b=>{b.onclick=()=>{S.fS=b.dataset.fs2;render();};});
  mi.querySelectorAll('[data-fp]').forEach(b=>{b.onclick=()=>{S.fP=b.dataset.fp;render();};});
  mi.querySelectorAll('[data-fjs]').forEach(b=>{b.onclick=()=>{S.fJS=b.dataset.fjs;render();};});

  // Project cards
  mi.querySelectorAll('[data-pid]').forEach(c=>{c.onclick=e=>{if(e.target.closest('.ibtn')||e.target.closest('.rbtns'))return;S.selProj=c.dataset.pid;render();};});
  mi.querySelectorAll('[data-ftask]').forEach(b=>{b.onclick=e=>{e.stopPropagation();openFM(b.dataset.ftask);};});
  mi.querySelectorAll('[data-ft]').forEach(el=>{el.onclick=async()=>{const id=el.dataset.ft,f=S.focus.find(x=>x.id===id);if(!f)return;await dbu('weekly_focus',id,{done:!f.done});f.done=!f.done;render();};});

  // Comments
  mi.querySelectorAll('[data-add-cmt]').forEach(b=>{b.onclick=async()=>{const inp=mi.querySelector(`[data-cmt-task="${b.dataset.addCmt}"]`);if(!inp||!inp.value.trim())return;const r=await dbi('task_comments',{task_id:b.dataset.addCmt,text:inp.value.trim()});if(r){S.comments.push(r);toast('Comment added.');render();}};});
  mi.querySelectorAll('[data-cmt-task]').forEach(inp=>{inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const btn=mi.querySelector(`[data-add-cmt="${inp.dataset.cmtTask}"]`);if(btn)btn.click();}};});

  // Ping
  mi.querySelectorAll('[data-ping]').forEach(b=>{b.onclick=()=>pingInfra(b.dataset.ping);});

  // Goal update
  mi.querySelectorAll('[data-update-goal]').forEach(b=>{b.onclick=()=>{const g2=S.goals.find(x=>x.id===b.dataset.updateGoal);if(g2)mGoal(g2);};});

  // Edit
  mi.querySelectorAll('[data-ep]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const p=S.projects.find(x=>x.id===b.dataset.ep);if(p)mProject(p);};});
  mi.querySelectorAll('[data-et]').forEach(b=>{b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.et);if(t)mTask(t);};});
  mi.querySelectorAll('[data-eg]').forEach(b=>{b.onclick=()=>{const g2=S.goals.find(x=>x.id===b.dataset.eg);if(g2)mGoal(g2);};});
  mi.querySelectorAll('[data-ei]').forEach(b=>{b.onclick=()=>{const i=S.infra.find(x=>x.id===b.dataset.ei);if(i)mInfra(i);};});
  mi.querySelectorAll('[data-ed]').forEach(b=>{b.onclick=()=>{const d=S.domains.find(x=>x.id===b.dataset.ed);if(d)mDomain(d);};});
  mi.querySelectorAll('[data-ej]').forEach(b=>{b.onclick=()=>{const j=S.jobs.find(x=>x.id===b.dataset.ej);if(j)mJob(j);};});

  // Delete
  mi.querySelectorAll('[data-dp]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const id=b.dataset.dp;confirmDel('Delete this project and all tasks?',async()=>{await dbd('projects',id);S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.project_id!==id);if(S.selProj===id)S.selProj=null;closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dt]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dt;confirmDel('Delete this task?',async()=>{await dbd('tasks',id);S.tasks=S.tasks.filter(t=>t.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dg]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dg;confirmDel('Delete this goal?',async()=>{await dbd('goals',id);S.goals=S.goals.filter(g=>g.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-di]').forEach(b=>{b.onclick=()=>{const id=b.dataset.di;confirmDel('Delete this record?',async()=>{await dbd('infra',id);S.infra=S.infra.filter(i=>i.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dd]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dd;confirmDel('Delete this domain?',async()=>{await dbd('study_domains',id);S.domains=S.domains.filter(d=>d.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dl]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dl;confirmDel('Delete this entry?',async()=>{await dbd('logs',id);S.logs=S.logs.filter(l=>l.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-df]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.df;await dbd('weekly_focus',id);S.focus=S.focus.filter(f=>f.id!==id);toast('Removed.');render();};});
  mi.querySelectorAll('[data-ds]').forEach(b=>{b.onclick=()=>{const id=b.dataset.ds;confirmDel('Remove?',async()=>{await dbd('someday',id);S.someday=S.someday.filter(s=>s.id!==id);closeM();toast('Removed.');render();});};});
  mi.querySelectorAll('[data-dj]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dj;confirmDel('Delete this application?',async()=>{await dbd('job_applications',id);S.jobs=S.jobs.filter(j=>j.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-stot]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.stot,s=S.someday.find(x=>x.id===id);if(!s)return;const r=await dbi('tasks',{text:s.text,status:'todo',priority:'medium',tag:'UPDATE',recurring:'none'});if(r){S.tasks.unshift(r);await dbd('someday',id);S.someday=S.someday.filter(x=>x.id!==id);toast('Moved to Tasks.');render();}};});

  // Weekly review inline
  const rvs=g('rv-save');
  if(rvs)rvs.onclick=async()=>{
    const cw=mon(),d={week_of:cw,finished:g('rv-f')?.value.trim()||null,carrying_over:g('rv-c')?.value.trim()||null,priorities:g('rv-p')?.value.trim()||null};
    const ex=S.reviews.find(r=>r.week_of===cw);
    if(ex){await dbu('weekly_reviews',ex.id,d);const i=S.reviews.findIndex(r=>r.id===ex.id);if(i>-1)S.reviews[i]={...S.reviews[i],...d};}
    else{const r=await dbi('weekly_reviews',d);if(r)S.reviews.unshift(r);}
    toast('Review saved.');render();
  };

  // Drag and drop
  mi.querySelectorAll('[data-tc]').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.tc;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
  mi.querySelectorAll('.kcol[data-col]').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dov');});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('dov');});
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('dov');
      if(!dragId)return;
      const ns=col.dataset.col,task=S.tasks.find(t=>t.id===dragId);
      if(!task||task.status===ns){dragId=null;return;}
      const toDone=ns==='done'&&task.status!=='done';
      await dbu('tasks',dragId,{status:ns});task.status=ns;
      if(toDone&&isRec(task))await handleRec(task);
      dragId=null;render();
    });
  });

  // Log
  const lgb=g('lg-btn');
  if(lgb){
    const doLog=async()=>{
      const text=g('lg-text')?.value.trim();if(!text){toast('Enter something.',true);return;}
      lgb.textContent='Logging...';lgb.disabled=true;
      const r=await dbi('logs',{text,tag:g('lg-tag')?.value||'UPDATE',project:g('lg-proj')?.value.trim()||null});
      if(r){S.logs.unshift(r);toast('Logged.');}
      lgb.textContent='Log it';lgb.disabled=false;render();
    };
    lgb.onclick=doLog;const lt=g('lg-text');if(lt)lt.onkeydown=e=>{if(e.key==='Enter')doLog();};
  }

  // Settings
  mi.querySelectorAll('[data-theme]').forEach(b=>{b.onclick=()=>{applyTheme(b.dataset.theme);render();};});
  mi.querySelectorAll('[data-fsset]').forEach(b=>{b.onclick=()=>{applyFS(b.dataset.fsset);render();};});

  // Modal backdrop
  document.getElementById('mo').onclick=e=>{if(e.target===document.getElementById('mo'))closeM();};

  // Login
  const lb=g('lb2');if(lb){lb.onclick=login;const lp=g('lp');if(lp)lp.onkeydown=e=>{if(e.key==='Enter')login();};}
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────
let gBuf='';
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  const typing=['INPUT','TEXTAREA','SELECT'].includes(tag);
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();return;}
  if(e.key==='Escape'){closeSearch();closeQA();closeKula();closeFM();return;}
  if(e.key==='/'&&!typing){e.preventDefault();openQA();return;}
  if(!typing){
    if(e.key==='g'){gBuf='g';setTimeout(()=>{gBuf='';},800);return;}
    if(gBuf==='g'){const map={d:'dashboard',p:'projects',t:'tasks',f:'focus',g:'goals',c:'career',i:'infra',s:'study',l:'log',r:'review'};if(map[e.key]){S.section=map[e.key];S.selProj=null;gBuf='';render();}gBuf='';}
  }
});

// ── KULA EVENTS ───────────────────────────────────────────────
document.getElementById('kula-topbtn').onclick=openKula;
document.getElementById('k-close').onclick=closeKula;
document.getElementById('k-send').onclick=()=>sendKula(document.getElementById('k-in').value);
document.getElementById('k-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendKula(document.getElementById('k-in').value);}});
document.getElementById('k-clr').onclick=clearKula;
document.querySelectorAll('.k-mode').forEach(b=>{b.onclick=()=>setKMode(b.dataset.mode);});

// ── SEARCH & QA EVENTS ───────────────────────────────────────
document.getElementById('sb-qa').onclick=openQA;
document.getElementById('sb-srch').onclick=openSearch;
document.getElementById('so').onclick=e=>{if(e.target===document.getElementById('so'))closeSearch();};
document.getElementById('si').oninput=e=>runSearch(e.target.value);
document.getElementById('qa-bg').onclick=closeQA;
document.getElementById('qa-sub').onclick=submitQA;
document.getElementById('qa-in').onkeydown=e=>{if(e.key==='Enter')submitQA();if(e.key==='Escape')closeQA();};

// ── FOCUS MODE EVENTS ────────────────────────────────────────
document.getElementById('fm-x').onclick=closeFM;
document.getElementById('fm-play').onclick=pomoStart;
document.getElementById('fm-reset').onclick=pomoReset;

// ── MOBILE ────────────────────────────────────────────────────
document.getElementById('mob-ham').onclick=openMob;
document.getElementById('sb-ov').onclick=closeMob;
document.querySelectorAll('.bni[data-nav]').forEach(b=>{b.onclick=()=>{S.section=b.dataset.nav;S.selProj=null;render();};});

// ── RENDER ────────────────────────────────────────────────────
function render(){
  setAcc();renderSB();renderTopbar();renderBotNav();
  let html='';
  if(S.section==='dashboard')      html=vDashboard();
  else if(S.section==='projects')  html=S.selProj?vProjDetail():vProjects();
  else if(S.section==='tasks')     html=vTasks();
  else if(S.section==='focus')     html=vFocus();
  else if(S.section==='goals')     html=vGoals();
  else if(S.section==='career')    html=vCareer();
  else if(S.section==='infra')     html=vInfra();
  else if(S.section==='study')     html=vStudy();
  else if(S.section==='someday')   html=vSomeday();
  else if(S.section==='log')       html=vLog();
  else if(S.section==='review')    html=vReview();
  else if(S.section==='settings')  html=vSettings();
  document.getElementById('mi').innerHTML=html;
  bindEvents();
}

// ── BOOT ──────────────────────────────────────────────────────
async function boot(){
  document.getElementById('loading').style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  initVoice();
  await loadAll();
  render();
}

async function init(){
  const {data:{session}}=await db.auth.getSession();
  document.getElementById('loading').style.display='none';
  if(session){await boot();}
  else{document.getElementById('login-screen').style.display='flex';bindEvents();}
}

init();
</script>
