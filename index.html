<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulan OS · Project Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#171f16; --surface:#1e2b1d; --surface2:#253525;
      --accent:#d4a853; --t1:#e8e4d9; --t2:#7a9478; --t3:#465944;
      --b1:rgba(255,255,255,0.06); --r:#c47a7a; --g:#7caa8a;
      --b:#6ba3be; --p:#b07fc4; --y:#c4a46b;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);height:100vh;overflow:hidden;}
    input,textarea,select{outline:none;color:var(--t1);}
    input::placeholder,textarea::placeholder{color:var(--t3);}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.7)}}
    .pulse{animation:pulse 2s infinite;}

    /* LOADING */
    #loading{display:flex;align-items:center;justify-content:center;height:100vh;font-size:13px;color:var(--t3);flex-direction:column;gap:10px;}
    .loading-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite;}

    /* LOGIN */
    #login-screen{display:none;align-items:center;justify-content:center;height:100vh;background:var(--bg);}
    .login-box{background:var(--surface);border:1px solid var(--b1);border-radius:16px;padding:42px 40px;width:380px;}
    .login-logo{font-size:9px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
    .login-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--t1);margin-bottom:4px;}
    .login-sub{font-size:12px;color:var(--t3);margin-bottom:30px;}
    .form-group{margin-bottom:14px;}
    .form-label{font-size:10px;color:var(--t2);display:block;margin-bottom:6px;letter-spacing:0.8px;text-transform:uppercase;}
    .form-input{width:100%;background:var(--bg);border:1px solid var(--b1);border-radius:8px;color:var(--t1);padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;transition:border-color 0.15s;}
    .form-input:focus{border-color:rgba(212,149,106,0.5);}
    select.form-input{cursor:pointer;}
    textarea.form-input{resize:vertical;min-height:80px;}
    .btn-primary{width:100%;background:var(--accent);border:none;border-radius:8px;color:#1a1408;padding:12px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:6px;transition:opacity 0.15s;}
    .btn-primary:hover{opacity:0.88;}
    .login-error{font-size:12px;color:var(--r);margin-top:10px;text-align:center;min-height:18px;}

    /* APP SHELL */
    #app{display:none;height:100vh;flex-direction:row;}

    /* SIDEBAR */
    #sidebar{width:212px;background:var(--surface);border-right:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;height:100vh;}
    .sb-brand{padding:22px 18px 18px;border-bottom:1px solid var(--b1);}
    .sb-org{font-size:8px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:5px;font-weight:600;}
    .sb-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--t1);letter-spacing:-0.3px;}
    #sb-nav{flex:1;padding:12px 8px;overflow-y:auto;}
    .nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--t2);font-size:13px;font-family:'DM Sans',sans-serif;text-align:left;margin-bottom:2px;transition:all 0.12s;font-weight:400;}
    .nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--t1);}
    .nav-btn.active{background:rgba(212,149,106,0.12);color:var(--accent);font-weight:500;}
    .nav-badge{margin-left:auto;font-size:9px;font-weight:700;background:rgba(190,128,128,0.2);color:var(--r);padding:1px 7px;border-radius:10px;}
    #sb-footer{padding:14px 18px;border-top:1px solid var(--b1);font-size:10px;color:var(--t3);line-height:1.8;}
    .sb-signout{background:none;border:none;color:var(--t3);font-size:10px;cursor:pointer;padding:0;margin-top:6px;font-family:'DM Sans',sans-serif;text-decoration:underline;}

    /* MAIN */
    #main{flex:1;overflow-y:auto;padding:30px 34px;}
    .main-inner{max-width:980px;}

    /* SHARED COMPONENTS */
    .section-label{font-size:9px;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:12px;font-weight:600;}
    .page-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--t1);font-weight:400;margin-bottom:22px;}
    .card{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:18px 20px;}
    .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;white-space:nowrap;}
    .pri-dot{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
    .tag-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:1px;text-transform:uppercase;}
    .progress-wrap{height:5px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:10px;}
    .flex-row{display:flex;align-items:center;}
    .flex-between{display:flex;justify-content:space-between;align-items:center;}
    .flex-gap{display:flex;align-items:center;gap:10px;}
    .divider{width:1px;height:20px;background:var(--b1);}
    .empty-state{text-align:center;padding:28px 0;font-size:12px;color:var(--t3);}

    /* BUTTONS */
    .btn-sm{padding:5px 13px;border-radius:7px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;}
    .btn-sm:hover{color:var(--t1);border-color:rgba(255,255,255,0.14);}
    .btn-accent{padding:7px 18px;border-radius:8px;border:none;background:var(--accent);color:#1a1408;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.15s;display:inline-flex;align-items:center;gap:6px;}
    .btn-accent:hover{opacity:0.88;}
    .btn-danger{padding:7px 14px;border-radius:8px;border:1px solid rgba(190,128,128,0.3);background:rgba(190,128,128,0.1);color:var(--r);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    .icon-btn{background:none;border:none;cursor:pointer;padding:3px;color:var(--t3);transition:color 0.12s;display:inline-flex;align-items:center;}
    .icon-btn:hover{color:var(--t1);}
    .icon-btn.del:hover{color:var(--r);}
    .row-btns{display:flex;gap:4px;opacity:0;transition:opacity 0.15s;}
    .card:hover .row-btns,.project-card:hover .row-btns,.task-card:hover .row-btns{opacity:1;}

    /* FILTERS */
    .filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
    .filter-label{font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-right:2px;}
    .filter-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;}
    .filter-btn.active{background:rgba(212,149,106,0.14);border-color:rgba(212,149,106,0.4);color:var(--accent);}
    .filter-btn:hover:not(.active){color:var(--t1);}

    /* PROJECTS GRID */
    .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px;}
    .project-card{background:var(--surface);border-radius:13px;padding:17px;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;}
    .project-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.25);}

    /* KANBAN */
    .kanban-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    .kanban-col{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:13px;min-height:200px;}
    .kanban-header{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
    .kanban-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .kanban-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
    .kanban-count{margin-left:auto;font-size:10px;color:var(--t3);background:rgba(255,255,255,0.05);padding:1px 7px;border-radius:10px;}
    .task-card{background:var(--bg);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;margin-bottom:8px;}

    /* MODAL */
    #modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;}
    #modal-overlay.show{display:flex;}
    .modal-box{background:var(--surface);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px 30px;width:490px;max-width:94vw;max-height:86vh;overflow-y:auto;}
    .modal-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--t1);margin-bottom:22px;font-weight:400;}
    .modal-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:1px solid var(--b1);}

    /* TOAST */
    #toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--t1);opacity:0;transform:translateY(10px);transition:all 0.25s;z-index:200;pointer-events:none;}
    #toast.show{opacity:1;transform:translateY(0);}
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loading-dot"></div>
  <span>Loading Kulan OS...</span>
</div>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Kulan Group Ltd</div>
    <div class="login-title">Project OS</div>
    <div class="login-sub">Private workspace. Authorized access only.</div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input id="login-email" type="email" class="form-input" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="login-pass" type="password" class="form-input" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="login-btn">Sign In</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <aside id="sidebar">
    <div class="sb-brand">
      <div class="sb-org">Kulan Group Ltd</div>
      <div class="sb-title">Project OS</div>
    </div>
    <nav id="sb-nav"></nav>
    <div id="sb-footer"></div>
  </aside>
  <main id="main"><div class="main-inner" id="main-inner"></div></main>
</div>

<!-- Modal -->
<div id="modal-overlay"><div class="modal-box" id="modal-box"></div></div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ============================================================
// CONFIG — Replace with your Supabase project credentials
// ============================================================
const SUPABASE_URL  = 'https://advphrgxoemjhgsqxkbl.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdnBocmd4b2Vtamhnc3F4a2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MzAyMjYsImV4cCI6MjA5MTAwNjIyNn0.8tiWdrqxgFvXLWCuHr3Z2KMOMMw8msU95QmKG9CfuP8';

// ============================================================
// SUPABASE INIT
// ============================================================
const { createClient } = supabase;
const supa = createClient(SUPABASE_URL, SUPABASE_ANON);

// ============================================================
// CONSTANTS
// ============================================================
const STATUS_META = {
  complete:{'label':'Complete','color':'#7caa8a'},
  live:{'label':'Live','color':'#6ba3be'},
  active:{'label':'Active','color':'#b07fc4'},
  'in-progress':{'label':'In Progress','color':'#c4a46b'},
  'at-risk':{'label':'At Risk','color':'#be8080'},
  pending:{'label':'Pending','color':'#8a8fa8'},
  stable:{'label':'Stable','color':'#7caa8a'},
  todo:{'label':'To Do','color':'#8a8fa8'},
  review:{'label':'In Review','color':'#6ba3be'},

const PRI_META = {

};
const TAG_COLORS = {INFRA:'#be8080',BUILD:'#6ba3be',CONTENT:'#b07fc4',SYSTEM:'#c4a46b',LAUNCH:'#7caa8a',STUDY:'#d4956a',UPDATE:'#8a8fa8'};
const CERT_COLORS = {'Security+ SY0-701':'#6ba3be','ISC2 CC':'#7caa8a'};
const VERTICALS   = ['Kulan Institute','Kulan Studio','Kulan Group','Personal'];
const STATUSES    = ['active','in-progress','complete','live','at-risk','pending'];
const PRIORITIES  = ['urgent','high','medium','low'];
const TASK_COLS   = ['todo','in-progress','review','done'];
const TAGS        = Object.keys(TAG_COLORS);
const COLORS      = ['#6ba3be','#7caa8a','#b07fc4','#d4956a','#c4a46b','#be8080','#8a8fa8'];
const INFRA_STATS = ['stable','at-risk','pending','active'];
const NAV = [
  {id:'dashboard',label:'Dashboard'},
  {id:'projects',label:'Projects'},
  {id:'tasks',label:'Tasks'},
  {id:'goals',label:'Goals'},
  {id:'infra',label:'Infrastructure'},
  {id:'study',label:'Study Tracker'},
  {id:'log',label:'Daily Log'},
];
const NAV_ICONS = {
  dashboard:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z',
  projects:'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z',
  tasks:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2',
  goals:'M13 10V3L4 14h7v7l9-11h-7z',
  infra:'M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2',
  study:'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253',
  log:'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z',
  plus:'M12 5v14M5 12h14',
  trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',
  pen:'M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z',
};

// ============================================================
// STATE
// ============================================================
let S = {
  section:'dashboard', selectedProjectId:null,
  filterV:'All', filterS:'All', filterP:'All',
  projects:[], tasks:[], goals:[], infra:[], logs:[], domains:[],
};

// ============================================================
// HELPERS
// ============================================================
const svg = (name,size=14,color='currentColor') =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${NAV_ICONS[name]||''}"/></svg>`;

const badge = s => { const m=STATUS_META[s]||{label:s,color:'#8a8fa8'}; return `<span class="badge" style="background:${m.color}18;color:${m.color};border:1px solid ${m.color}28">${m.label}</span>`; };
const priDot = p => { const m=PRI_META[p]||{label:p,color:'#8a8fa8'}; return `<span class="pri-dot" style="color:${m.color}"><span style="width:5px;height:5px;border-radius:50%;background:${m.color};display:inline-block"></span>${m.label}</span>`; };
const tagChip = t => { const c=TAG_COLORS[t]||'#8a8fa8'; return `<span class="tag-chip" style="background:${c}18;color:${c}">${t}</span>`; };
const pBar = (pct,col,h=5) => `<div class="progress-wrap" style="height:${h}px"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${col}70,${col})"></div></div>`;
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const getProjName = id => (S.projects.find(p=>p.id===id)||{}).name||'';
const getProjColor = id => (S.projects.find(p=>p.id===id)||{}).color||'#8a8fa8';
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';

function toast(msg,dur=2600) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

// ============================================================
// AUTH
// ============================================================
async function login() {
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  const err=document.getElementById('login-error');
  err.textContent='';
  if(!email||!pass){err.textContent='Enter your email and password.';return;}
  document.getElementById('login-btn').textContent='Signing in...';
  const {error}=await supa.auth.signInWithPassword({email,password:pass});
  document.getElementById('login-btn').textContent='Sign In';
  if(error){err.textContent=error.message;return;}
  await bootApp();
}

async function logout() {
  await supa.auth.signOut();
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

// ============================================================
// DATA
// ============================================================
async function loadAll() {
  const [p,t,g,i,l,d] = await Promise.all([
    supa.from('projects').select('*').order('created_at',{ascending:false}),
    supa.from('tasks').select('*').order('created_at',{ascending:false}),
    supa.from('goals').select('*').order('created_at',{ascending:false}),
    supa.from('infra').select('*').order('created_at',{ascending:false}),
    supa.from('logs').select('*').order('created_at',{ascending:false}),
    supa.from('study_domains').select('*').order('cert,name'),
  ]);
  S.projects=p.data||[]; S.tasks=t.data||[]; S.goals=g.data||[];
  S.infra=i.data||[]; S.logs=l.data||[]; S.domains=d.data||[];
}

async function dbInsert(table,data) {
  const {data:row,error}=await supa.from(table).insert(data).select().single();
  if(error){toast('Error: '+error.message);return null;}
  return row;
}
async function dbUpdate(table,id,data) {
  const {error}=await supa.from(table).update(data).eq('id',id);
  if(error){toast('Error: '+error.message);return false;}
  return true;
}
async function dbDelete(table,id) {
  const {error}=await supa.from(table).delete().eq('id',id);
  if(error){toast('Error: '+error.message);return false;}
  return true;
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar() {
  const urgCount=S.tasks.filter(t=>t.priority==='urgent'&&t.status!=='done').length;
  document.getElementById('sb-nav').innerHTML=NAV.map(n=>`
    <button class="nav-btn ${S.section===n.id?'active':''}" data-nav="${n.id}">
      ${svg(n.id,14)} ${n.label}
      ${n.id==='tasks'&&urgCount>0?`<span class="nav-badge">${urgCount}</span>`:''}
    </button>`).join('');
  document.getElementById('sb-footer').innerHTML=`
    <div>${S.projects.length} projects &nbsp;·&nbsp; ${S.tasks.filter(t=>t.status!=='done').length} open tasks</div>
    <div style="margin-top:4px;color:var(--accent);font-weight:500">Muzz · Kulan Group Ltd</div>
    <button class="sb-signout" onclick="logout()">Sign out</button>`;
  document.querySelectorAll('.nav-btn[data-nav]').forEach(b=>{
    b.onclick=()=>{S.section=b.dataset.nav;S.selectedProjectId=null;render();};
  });
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const urgent=S.tasks.filter(t=>t.priority==='urgent'&&t.status!=='done');
  const atRisk=S.projects.filter(p=>p.status==='at-risk');
  const h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const dStr=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const stats=[
    {label:'Total Projects',val:S.projects.length,color:'var(--accent)'},
    {label:'In Progress',val:S.projects.filter(p=>p.status==='in-progress').length,color:'#c4a46b'},
    {label:'At Risk',val:atRisk.length,color:'#be8080'},
    {label:'Urgent Tasks',val:urgent.length,color:'#be8080'},

const showModal = html => { document.getElementById('modal-box').innerHTML=html; document.getElementById('modal-overlay').classList.add('show'); };
const closeModal = () => document.getElementById('modal-overlay').classList.remove('show');
const mFooter = () => `<div class="modal-footer"><button class="btn-sm" onclick="closeModal()">Cancel</button><button class="btn-accent" id="modal-ok">Save</button></div>`;

function openProjectModal(e=null) {
  showModal(`
    <div class="modal-title">${e?'Edit Project':'New Project'}</div>
    <div class="form-group"><label class="form-label">Name</label><input id="m-name" type="text" class="form-input" value="${esc(e?.name||'')}" placeholder="Project name"></div>
    <div class="modal-grid-2">
      <div class="form-group"><label class="form-label">Vertical</label><select id="m-vert" class="form-input">${VERTICALS.map(v=>`<option value="${v}" ${e?.vertical===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Status</label><select id="m-status" class="form-input">${STATUSES.map(s=>`<option value="${s}" ${e?.status===s?'selected':''}>${STATUS_META[s]?.label||s}</option>`).join('')}</select></div>
    </div>
    <div class="modal-grid-2">
      <div class="form-group"><label class="form-label">Priority</label><select id="m-pri" class="form-input">${PRIORITIES.map(p=>`<option value="${p}" ${e?.priority===p?'selected':''}>${PRI_META[p]?.label||p}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Color</label><select id="m-col" class="form-input">${COLORS.map(c=>`<option value="${c}" ${e?.color===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label class="form-label">URL</label><input id="m-url" type="text" class="form-input" value="${esc(e?.url||'')}" placeholder="kulaninstitute.org/project"></div>
    <div class="form-group"><label class="form-label">Stack</label><input id="m-stack" type="text" class="form-input" value="${esc(e?.stack||'')}" placeholder="React · Supabase · GitHub Pages"></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea id="m-notes" class="form-input">${esc(e?.notes||'')}</textarea></div>
    ${mFooter()}`);
  document.getElementById('modal-ok').onclick=async()=>{
    const d={name:document.getElementById('m-name').value.trim(),vertical:document.getElementById('m-vert').value,status:document.getElementById('m-status').value,priority:document.getElementById('m-pri').value,color:document.getElementById('m-col').value,url:document.getElementById('m-url').value.trim(),stack:document.getElementById('m-stack').value.trim(),notes:document.getElementById('m-notes').value.trim()};
    if(!d.name){toast('Project name is required.');return;}
    document.getElementById('modal-ok').textContent='Saving...';
    if(e){await dbUpdate('projects',e.id,d);const i=S.projects.findIndex(p=>p.id===e.id);if(i>-1)S.projects[i]={...S.projects[i],...d};toast('Project updated.');}

function confirmDel(msg,onConfirm) {
  showModal(`<div class="modal-title">Confirm Delete</div><p style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:22px">${msg}</p><div class="modal-footer" style="margin-top:0;padding-top:0;border-top:none"><button class="btn-sm" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirm-del">Delete</button></div>`);
  document.getElementById('confirm-del').onclick=onConfirm;
}

// ============================================================
// EVENT BINDING
// ============================================================
function bindEvents() {
  const m=document.getElementById('main-inner');
  if(!m) return;

  // Sidebar nav
  document.querySelectorAll('[data-nav]').forEach(b=>{ b.onclick=()=>{S.section=b.dataset.nav;S.selectedProjectId=null;render();}; });

  // Filters
  m.querySelectorAll('[data-fv]').forEach(b=>{ b.onclick=()=>{S.filterV=b.dataset.fv;render();}; });
  m.querySelectorAll('[data-fs]').forEach(b=>{ b.onclick=()=>{S.filterS=b.dataset.fs;render();}; });
  m.querySelectorAll('[data-fp]').forEach(b=>{ b.onclick=()=>{S.filterP=b.dataset.fp;render();}; });

  // Project detail
  m.querySelectorAll('[data-project-id]').forEach(c=>{ c.onclick=e=>{ if(e.target.closest('.icon-btn'))return; S.selectedProjectId=c.dataset.projectId; render(); }; });
  const backBtn=document.getElementById('btn-back');
  if(backBtn) backBtn.onclick=()=>{S.selectedProjectId=null;render();};

  // Add buttons
  const ap=document.getElementById('btn-add-project'); if(ap) ap.onclick=()=>openProjectModal();
  const at=document.getElementById('btn-add-task');    if(at) at.onclick=()=>openTaskModal();
  const atd=document.getElementById('btn-add-task-detail'); if(atd) atd.onclick=()=>openTaskModal(null,S.selectedProjectId);
  const ag=document.getElementById('btn-add-goal');    if(ag) ag.onclick=()=>openGoalModal();
  const ai=document.getElementById('btn-add-infra');   if(ai) ai.onclick=()=>openInfraModal();
  const ad=document.getElementById('btn-add-domain');  if(ad) ad.onclick=()=>openDomainModal();

  // Edit
  m.querySelectorAll('[data-edit-project]').forEach(b=>{ b.onclick=e=>{e.stopPropagation();const p=S.projects.find(x=>x.id===b.dataset.editProject);if(p)openProjectModal(p);}; });
  m.querySelectorAll('[data-edit-task]').forEach(b=>{    b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.editTask);if(t)openTaskModal(t);}; });
  m.querySelectorAll('[data-edit-goal]').forEach(b=>{    b.onclick=()=>{const g=S.goals.find(x=>x.id===b.dataset.editGoal);if(g)openGoalModal(g);}; });
  m.querySelectorAll('[data-edit-infra]').forEach(b=>{   b.onclick=()=>{const i=S.infra.find(x=>x.id===b.dataset.editInfra);if(i)openInfraModal(i);}; });
  m.querySelectorAll('[data-edit-domain]').forEach(b=>{  b.onclick=()=>{const d=S.domains.find(x=>x.id===b.dataset.editDomain);if(d)openDomainModal(d);}; });

  // Delete
  m.querySelectorAll('[data-del-project]').forEach(b=>{ b.onclick=e=>{e.stopPropagation();const id=b.dataset.delProject;confirmDel('Permanently delete this project and all its tasks?',async()=>{await dbDelete('projects',id);S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.project_id!==id);if(S.selectedProjectId===id)S.selectedProjectId=null;closeModal();toast('Project deleted.');render();});}; });
  m.querySelectorAll('[data-del-task]').forEach(b=>{    b.onclick=()=>{const id=b.dataset.delTask;confirmDel('Delete this task?',async()=>{await dbDelete('tasks',id);S.tasks=S.tasks.filter(t=>t.id!==id);closeModal();toast('Task deleted.');render();});}; });
  m.querySelectorAll('[data-del-goal]').forEach(b=>{    b.onclick=()=>{const id=b.dataset.delGoal;confirmDel('Delete this goal?',async()=>{await dbDelete('goals',id);S.goals=S.goals.filter(g=>g.id!==id);closeModal();toast('Goal deleted.');render();});}; });
  m.querySelectorAll('[data-del-infra]').forEach(b=>{   b.onclick=()=>{const id=b.dataset.delInfra;confirmDel('Delete this infrastructure record?',async()=>{await dbDelete('infra',id);S.infra=S.infra.filter(i=>i.id!==id);closeModal();toast('Record deleted.');render();});}; });
  m.querySelectorAll('[data-del-domain]').forEach(b=>{  b.onclick=()=>{const id=b.dataset.delDomain;confirmDel('Delete this study domain?',async()=>{await dbDelete('study_domains',id);S.domains=S.domains.filter(d=>d.id!==id);closeModal();toast('Domain deleted.');render();});}; });
  m.querySelectorAll('[data-del-log]').forEach(b=>{     b.onclick=()=>{const id=b.dataset.delLog;confirmDel('Delete this log entry?',async()=>{await dbDelete('logs',id);S.logs=S.logs.filter(l=>l.id!==id);closeModal();toast('Entry deleted.');render();});}; });

  // Log submit
  const logBtn=document.getElementById('btn-log');
  if(logBtn){
    const doLog=async()=>{
      const text=document.getElementById('log-text').value.trim();
      const tag=document.getElementById('log-tag').value;
      const project=document.getElementById('log-project').value.trim();
      if(!text){toast('Enter something to log.');return;}
      logBtn.textContent='Logging...';
      const row=await dbInsert('logs',{text,tag,project:project||null});
      if(row){S.logs.unshift(row);toast('Logged.');}
      logBtn.textContent='Log it'; render();
    };
    logBtn.onclick=doLog;
    document.getElementById('log-text').onkeydown=e=>{if(e.key==='Enter')doLog();};
  }

  // Modal close on overlay click
  document.getElementById('modal-overlay').onclick=e=>{if(e.target===document.getElementById('modal-overlay'))closeModal();};

  // Login
  const loginBtn=document.getElementById('login-btn');
  if(loginBtn){
    loginBtn.onclick=login;
    const lp=document.getElementById('login-pass');
    if(lp) lp.onkeydown=e=>{if(e.key==='Enter')login();};
  }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  renderSidebar();
  let html='';
  if(S.section==='dashboard')        html=renderDashboard();
  else if(S.section==='projects')    html=S.selectedProjectId?renderProjectDetail():renderProjects();
  else if(S.section==='tasks')       html=renderTasks();
  else if(S.section==='goals')       html=renderGoals();
  else if(S.section==='infra')       html=renderInfra();
  else if(S.section==='study')       html=renderStudy();
  else if(S.section==='log')         html=renderLog();
  document.getElementById('main-inner').innerHTML=html;
  bindEvents();
}

// ============================================================
// BOOT
// ============================================================
async function bootApp() {
  document.getElementById('loading').style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  await loadAll();
  render();
}

async function init() {
  const {data:{session}}=await supa.auth.getSession();
  document.getElementById('loading').style.display='none';
  if(session){ await bootApp(); }
  else{ document.getElementById('login-screen').style.display='flex'; bindEvents(); }
}

init();
</script>
