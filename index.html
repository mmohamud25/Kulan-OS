<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulan OS · Project Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* FOREST FOCUS (dark default) */
:root{--bg:#171f16;--surface:#1e2b1d;--surface2:#253525;--accent:#d4a853;--t1:#e8e4d9;--t2:#7a9478;--t3:#465944;--b1:rgba(255,255,255,0.06);--r:#c47a7a;--g:#7caa8a;--b:#6ba3be;--p:#b07fc4;--y:#c4a46b;}
/* WARM LINEN (light) */
body.light{--bg:#f5f0e8;--surface:#ede7d9;--surface2:#e3dbc8;--accent:#c4622d;--t1:#1e1a16;--t2:#6b5f52;--t3:#a8998a;--b1:rgba(0,0,0,0.07);--r:#c04a4a;--g:#3a7a52;--b:#2a5a7a;--p:#6a3a8a;--y:#7a5a1a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);height:100vh;overflow:hidden;transition:background 0.3s,color 0.3s;}
input,textarea,select{outline:none;color:var(--t1);}
input::placeholder,textarea::placeholder{color:var(--t3);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.2);border-radius:4px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.7)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s infinite;}
.fade-in{animation:fadeIn 0.2s ease;}

/* LOADING */
#loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;font-size:13px;color:var(--t3);}
.loading-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite;}

/* LOGIN */
#login-screen{display:none;align-items:center;justify-content:center;height:100vh;}
.login-box{background:var(--surface);border:1px solid var(--b1);border-radius:16px;padding:42px 40px;width:380px;}
.login-logo{font-size:9px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
.login-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--t1);margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--t3);margin-bottom:30px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;color:var(--t2);display:block;margin-bottom:6px;letter-spacing:0.8px;text-transform:uppercase;}
.form-input{width:100%;background:var(--bg);border:1px solid var(--b1);border-radius:8px;color:var(--t1);padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;transition:border-color 0.15s;}
.form-input:focus{border-color:rgba(212,168,83,0.5);}
body.light .form-input:focus{border-color:rgba(196,98,45,0.5);}
select.form-input{cursor:pointer;}
textarea.form-input{resize:vertical;min-height:80px;}
.btn-primary{width:100%;background:var(--accent);border:none;border-radius:8px;color:#fff;padding:12px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:6px;transition:opacity 0.15s;}
body.light .btn-primary{color:#fff;}
.btn-primary:hover{opacity:0.88;}
.login-error{font-size:12px;color:var(--r);margin-top:10px;text-align:center;min-height:18px;}

/* APP */
#app{display:none;height:100vh;flex-direction:row;}

/* SIDEBAR */
#sidebar{width:215px;background:var(--surface);border-right:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;height:100vh;transition:background 0.3s;}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid var(--b1);}
.sb-org{font-size:8px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;font-weight:600;}
.sb-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--t1);}
#sb-nav{flex:1;padding:10px 8px;overflow-y:auto;}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--t2);font-size:13px;font-family:'DM Sans',sans-serif;text-align:left;margin-bottom:1px;transition:all 0.12s;font-weight:400;}
.nav-btn:hover{background:rgba(128,128,128,0.07);color:var(--t1);}
.nav-btn.active{background:rgba(212,168,83,0.12);color:var(--accent);font-weight:500;}
body.light .nav-btn.active{background:rgba(196,98,45,0.1);}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;background:rgba(196,122,122,0.2);color:var(--r);padding:1px 7px;border-radius:10px;}
.nav-sep{height:1px;background:var(--b1);margin:6px 10px;}
#sb-footer{padding:12px 16px;border-top:1px solid var(--b1);font-size:10px;color:var(--t3);line-height:1.8;}
.sb-footer-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.sb-signout{background:none;border:none;color:var(--t3);font-size:10px;cursor:pointer;padding:0;font-family:'DM Sans',sans-serif;text-decoration:underline;}
.theme-btn{background:none;border:1px solid var(--b1);border-radius:6px;color:var(--t2);cursor:pointer;padding:3px 8px;font-size:11px;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.theme-btn:hover{color:var(--t1);border-color:rgba(128,128,128,0.2);}

/* MAIN */
#main{flex:1;overflow-y:auto;padding:28px 32px;}
.main-inner{max-width:980px;}

/* SHARED */
.section-label{font-size:9px;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:12px;font-weight:600;}
.page-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--t1);font-weight:400;margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:18px 20px;transition:background 0.3s;}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;white-space:nowrap;}
.pri-dot{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.tag-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:1px;text-transform:uppercase;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.flex-gap{display:flex;align-items:center;gap:10px;}
.divider{width:1px;height:20px;background:var(--b1);}
.empty-state{text-align:center;padding:28px 0;font-size:12px;color:var(--t3);}

/* BUTTONS */
.btn-sm{padding:5px 13px;border-radius:7px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;}
.btn-sm:hover{color:var(--t1);border-color:rgba(128,128,128,0.2);}
.btn-accent{padding:7px 16px;border-radius:8px;border:none;background:var(--accent);color:#1a1408;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.15s;display:inline-flex;align-items:center;gap:6px;}
body.light .btn-accent{color:#fff;}
.btn-accent:hover{opacity:0.88;}
.btn-danger{padding:7px 14px;border-radius:8px;border:1px solid rgba(196,122,122,0.3);background:rgba(196,122,122,0.1);color:var(--r);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.icon-btn{background:none;border:none;cursor:pointer;padding:3px;color:var(--t3);transition:color 0.12s;display:inline-flex;align-items:center;}
.icon-btn:hover{color:var(--t1);}
.icon-btn.del:hover{color:var(--r);}
.row-btns{display:flex;gap:4px;opacity:0;transition:opacity 0.15s;}
.card:hover .row-btns,.project-card:hover .row-btns,.task-card:hover .row-btns{opacity:1;}

/* FILTERS */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-label{font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-right:2px;}
.filter-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;}
.filter-btn.active{background:rgba(212,168,83,0.14);border-color:rgba(212,168,83,0.4);color:var(--accent);}
body.light .filter-btn.active{background:rgba(196,98,45,0.1);border-color:rgba(196,98,45,0.4);}
.filter-btn:hover:not(.active){color:var(--t1);}

/* PROJECTS */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px;}
.project-card{background:var(--surface);border-radius:13px;padding:17px;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;}
.project-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2);}
.health-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:9px;font-weight:700;flex-shrink:0;}
.proj-progress{height:3px;border-radius:10px;overflow:hidden;background:rgba(128,128,128,0.1);margin-top:10px;}
.proj-progress-fill{height:100%;border-radius:10px;}

/* KANBAN */
.kanban-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kanban-col{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:13px;min-height:200px;transition:border-color 0.15s;}
.kanban-col.drag-over{border-color:var(--accent);background:rgba(212,168,83,0.05);}
.kanban-header{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.kanban-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.kanban-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.kanban-count{margin-left:auto;font-size:10px;color:var(--t3);background:rgba(128,128,128,0.1);padding:1px 7px;border-radius:10px;}
.task-card{background:var(--bg);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab;transition:opacity 0.15s,box-shadow 0.15s;}
.task-card:active{cursor:grabbing;}
.task-card.dragging{opacity:0.4;}
.task-card.drag-placeholder{border:1px dashed var(--accent);background:rgba(212,168,83,0.05);height:60px;}

/* DEADLINE ALERTS */
.deadline-banner{background:rgba(196,164,107,0.12);border:1px solid rgba(196,164,107,0.3);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;}
.deadline-banner-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.deadline-item{font-size:12px;color:var(--t1);line-height:1.5;}
.deadline-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--y);margin-right:6px;}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;}
#modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border:1px solid rgba(128,128,128,0.15);border-radius:16px;padding:28px 30px;width:490px;max-width:94vw;max-height:86vh;overflow-y:auto;}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--t1);margin-bottom:22px;font-weight:400;}
.modal-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:1px solid var(--b1);}

/* POMODORO WIDGET */
#pomo-widget{position:fixed;bottom:80px;right:24px;background:var(--surface);border:1px solid var(--b1);border-radius:14px;padding:16px 20px;width:220px;z-index:90;display:none;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
#pomo-widget.show{display:block;}
.pomo-label{font-size:10px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.pomo-task{font-size:12px;color:var(--t2);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pomo-time{font-family:'DM Serif Display',serif;font-size:36px;color:var(--accent);line-height:1;margin-bottom:12px;letter-spacing:-1px;}
.pomo-time.warning{color:var(--r);}
.pomo-controls{display:flex;gap:6px;}
.pomo-btn{flex:1;padding:6px;border-radius:7px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.12s;text-align:center;}
.pomo-btn:hover{color:var(--t1);border-color:rgba(128,128,128,0.2);}
.pomo-btn.primary{background:var(--accent);color:#1a1408;border-color:transparent;}
body.light .pomo-btn.primary{color:#fff;}
.pomo-sessions{font-size:10px;color:var(--t3);margin-top:10px;text-align:center;}
#pomo-trigger{position:fixed;bottom:24px;right:92px;background:var(--surface);border:1px solid var(--b1);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--t2);cursor:pointer;font-family:'DM Sans',sans-serif;z-index:90;transition:all 0.15s;}
#pomo-trigger:hover{color:var(--t1);}

/* QUICK ADD */
#quick-add-overlay{display:none;position:fixed;inset:0;z-index:150;align-items:flex-start;justify-content:center;padding-top:120px;}
#quick-add-overlay.show{display:flex;}
.qa-backdrop{position:absolute;inset:0;}
.qa-box{position:relative;background:var(--surface);border:1px solid rgba(128,128,128,0.2);border-radius:14px;padding:16px 18px;width:540px;max-width:92vw;box-shadow:0 16px 48px rgba(0,0,0,0.4);}
.qa-hint{font-size:10px;color:var(--t3);margin-bottom:10px;letter-spacing:0.5px;}
#qa-input{width:100%;background:transparent;border:none;color:var(--t1);font-size:16px;font-family:'DM Sans',sans-serif;padding:0;margin-bottom:12px;}
#qa-input::placeholder{color:var(--t3);}
.qa-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.qa-select{background:var(--bg);border:1px solid var(--b1);border-radius:7px;color:var(--t2);padding:5px 10px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.qa-esc{font-size:10px;color:var(--t3);margin-left:auto;}

/* WEEKLY FOCUS */
.focus-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--b1);border-radius:9px;margin-bottom:8px;transition:opacity 0.2s;}
.focus-item.done-item{opacity:0.5;}
.focus-check{width:16px;height:16px;border-radius:4px;border:1px solid var(--t3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.focus-check.checked{background:var(--accent);border-color:var(--accent);}
.focus-text{flex:1;font-size:13px;line-height:1.4;}
.focus-text.done-text{text-decoration:line-through;color:var(--t3);}
.focus-proj{font-size:10px;color:var(--t3);margin-top:2px;}
.week-label{font-size:11px;color:var(--t2);margin-bottom:16px;}
.focus-counter{font-size:11px;color:var(--t3);}

/* SOMEDAY */
.someday-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg);border:1px solid var(--b1);border-radius:8px;margin-bottom:7px;}
.someday-text{flex:1;font-size:13px;}
.someday-cat{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:1px;}

/* TIME LOGGING */
.timer-display{font-size:10px;color:var(--accent);font-weight:600;font-family:monospace;}
.timer-btn-sm{background:none;border:1px solid var(--b1);border-radius:5px;color:var(--t3);cursor:pointer;padding:2px 7px;font-size:10px;font-family:'DM Sans',sans-serif;transition:all 0.12s;}
.timer-btn-sm:hover{color:var(--t1);}
.timer-btn-sm.active{border-color:var(--accent);color:var(--accent);}

/* PROGRESS BAR */
.pbar{height:5px;background:rgba(128,128,128,0.1);border-radius:10px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:10px;}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid rgba(128,128,128,0.15);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--t1);opacity:0;transform:translateY(10px);transition:all 0.25s;z-index:200;pointer-events:none;}
#toast.show{opacity:1;transform:translateY(0);}

/* RECURRING BADGE */
.rec-badge{font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(107,163,190,0.15);color:#6ba3be;border:1px solid rgba(107,163,190,0.2);}
</style>
</head>
<body>

<div id="loading"><div class="loading-dot"></div><span>Loading Kulan OS...</span></div>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Kulan Group Ltd</div>
    <div class="login-title">Project OS</div>
    <div class="login-sub">Private workspace. Authorized access only.</div>
    <div class="form-group"><label class="form-label">Email</label><input id="login-email" type="email" class="form-input" placeholder="your@email.com"></div>
    <div class="form-group"><label class="form-label">Password</label><input id="login-pass" type="password" class="form-input" placeholder="••••••••"></div>
    <button class="btn-primary" id="login-btn">Sign In</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="sb-brand"><div class="sb-org">Kulan Group Ltd</div><div class="sb-title">Project OS</div></div>
    <nav id="sb-nav"></nav>
    <div id="sb-footer"></div>
  </aside>
  <main id="main"><div class="main-inner" id="main-inner"></div></main>
</div>

<!-- Pomodoro -->
<div id="pomo-widget">
  <div class="pomo-label">Focus Session</div>
  <div class="pomo-task" id="pomo-task-label">—</div>
  <div class="pomo-time" id="pomo-display">25:00</div>
  <div class="pomo-controls">
    <button class="pomo-btn primary" id="pomo-play-btn">▶ Start</button>
    <button class="pomo-btn" id="pomo-reset-btn">↺</button>
    <button class="pomo-btn" id="pomo-close-btn">✕</button>
  </div>
  <div class="pomo-sessions" id="pomo-sessions">0 sessions today</div>
</div>
<button id="pomo-trigger">🍅 Pomodoro</button>

<!-- Quick Add Overlay -->
<div id="quick-add-overlay">
  <div class="qa-backdrop" id="qa-backdrop"></div>
  <div class="qa-box">
    <div class="qa-hint">Press <strong>Enter</strong> to save · <strong>Esc</strong> to close</div>
    <input id="qa-input" placeholder="What do you need to add?..." autocomplete="off">
    <div class="qa-row">
      <select id="qa-type" class="qa-select">
        <option value="task">Task</option>
        <option value="log">Log Entry</option>
        <option value="someday">Parking Lot</option>
        <option value="focus">Weekly Focus</option>
      </select>
      <select id="qa-project" class="qa-select"><option value="">No project</option></select>
      <select id="qa-priority" class="qa-select">
        <option value="medium">Medium</option>
        <option value="urgent">Urgent</option>
        <option value="high">High</option>
        <option value="low">Low</option>
      </select>
      <button class="btn-accent" id="qa-submit" style="font-size:12px;padding:5px 14px">Add</button>
      <span class="qa-esc">Press / to open</span>
    </div>
  </div>
</div>

<div id="modal-overlay"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const SUPABASE_URL  = 'https://advphrgxoemjhgsqxkbl.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdnBocmd4b2Vtamhnc3F4a2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MzAyMjYsImV4cCI6MjA5MTAwNjIyNn0.8tiWdrqxgFvXLWCuHr3Z2KMOMMw8msU95QmKG9CfuP8';

const {createClient}=supabase;
const supa=createClient(SUPABASE_URL,SUPABASE_ANON);

// ─── CONSTANTS ────────────────────────────────────────────
const SM={complete:{label:'Complete',color:'#7caa8a'},live:{label:'Live',color:'#6ba3be'},active:{label:'Active',color:'#b07fc4'},'in-progress':{label:'In Progress',color:'#c4a46b'},'at-risk':{label:'At Risk',color:'#c47a7a'},pending:{label:'Pending',color:'#8a9e87'},stable:{label:'Stable',color:'#7caa8a'},todo:{label:'To Do',color:'#8a9e87'},review:{label:'In Review',color:'#6ba3be'},done:{label:'Done',color:'#7caa8a'}};

// ─── HEALTH SCORE ─────────────────────────────────────────
function healthScore(p){
  let score=100;
  if(p.status==='at-risk') score-=30;
  const pt=S.tasks.filter(t=>t.project_id===p.id);
  score-=pt.filter(t=>t.priority==='urgent'&&t.status!=='done').length*15;
  score-=pt.filter(t=>t.due_date&&t.status!=='done'&&new Date(t.due_date)<new Date()).length*10;
  if(S.infra.find(i=>i.project===p.name&&i.status==='at-risk')) score-=20;
  const lastLog=S.logs.find(l=>l.project===p.name&&new Date(l.created_at)>new Date(Date.now()-7*864e5));
  if(lastLog) score+=10;
  return Math.max(0,Math.min(100,score));
}
function hColor(s){return s>=80?'#7caa8a':s>=60?'#c4a46b':s>=40?'#d4a853':'#c47a7a';}
function projProg(id){const t=S.tasks.filter(x=>x.project_id===id);if(!t.length)return null;return Math.round(t.filter(x=>x.status==='done').length/t.length*100);}

// ─── DEADLINE ALERTS ──────────────────────────────────────
function getAlerts(){
  const now=new Date(),soon=new Date(now.getTime()+7*864e5),alerts=[];
  S.goals.filter(g=>g.deadline&&new Date(g.deadline)>=now&&new Date(g.deadline)<=soon).forEach(g=>alerts.push({name:g.name,date:g.deadline,type:'Goal'}));
  S.tasks.filter(t=>t.status!=='done'&&t.due_date&&new Date(t.due_date)>=now&&new Date(t.due_date)<=soon).forEach(t=>alerts.push({name:t.text,date:t.due_date,type:'Task'}));
  return alerts;
}

// ─── POMODORO ─────────────────────────────────────────────
function updatePomoDisplay(){
  const d=document.getElementById('pomo-display');
  const btn=document.getElementById('pomo-play-btn');
  if(!d)return;
  d.textContent=fmtSecs(pomo.remaining);
  d.className='pomo-time'+(pomo.remaining<=60?' warning':'');
  if(btn) btn.textContent=pomo.active&&!pomo.paused?'⏸ Pause':'▶ Start';
}
function startPomo(){
  if(pomo.active&&!pomo.paused){pomo.paused=true;clearInterval(pomo.interval);updatePomoDisplay();return;}
  if(pomo.paused){pomo.paused=false;}
  else{if(pomo.remaining<=0)pomo.remaining=25*60;}
  pomo.active=true;pomo.paused=false;
  pomo.interval=setInterval(()=>{
    pomo.remaining--;
    if(pomo.remaining<=0){
      clearInterval(pomo.interval);pomo.active=false;pomo.remaining=0;
      pomo.sessions++;
      document.getElementById('pomo-sessions').textContent=`${pomo.sessions} session${pomo.sessions!==1?'s':''} today`;
      if(pomo.label){supa.from('logs').insert({text:`Completed a 25-min focus session${pomo.label?' on '+pomo.label:''}`,tag:'SYSTEM',project:pomo.label||null}).then(()=>{loadAll().then(()=>{if(S.section==='dashboard'||S.section==='log')render();});});}
      toast('🍅 Pomodoro complete! Take a 5 min break.');
    }
    updatePomoDisplay();
  },1000);
  updatePomoDisplay();
}
function resetPomo(){clearInterval(pomo.interval);pomo.active=false;pomo.paused=false;pomo.remaining=25*60;updatePomoDisplay();}
function initPomo(){
  document.getElementById('pomo-trigger').onclick=()=>{document.getElementById('pomo-widget').classList.toggle('show');};
  document.getElementById('pomo-play-btn').onclick=startPomo;
  document.getElementById('pomo-reset-btn').onclick=resetPomo;
  document.getElementById('pomo-close-btn').onclick=()=>{resetPomo();document.getElementById('pomo-widget').classList.remove('show');};
}

function openQuickAdd(){
  const overlay=document.getElementById('quick-add-overlay');
  const projSel=document.getElementById('qa-project');
  projSel.innerHTML='<option value="">No project</option>'+S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  overlay.classList.add('show');
  setTimeout(()=>document.getElementById('qa-input').focus(),50);
}
function closeQuickAdd(){document.getElementById('quick-add-overlay').classList.remove('show');document.getElementById('qa-input').value='';}
async function submitQuickAdd(){
  const text=document.getElementById('qa-input').value.trim();
  const type=document.getElementById('qa-type').value;
  const pid=document.getElementById('qa-project').value||null;
  const pri=document.getElementById('qa-priority').value;
  if(!text)return;
  if(type==='task'){const row=await dbInsert('tasks',{text,project_id:pid,status:'todo',priority:pri,tag:'UPDATE'});if(row)S.tasks.unshift(row);}
  else if(type==='log'){const row=await dbInsert('logs',{text,tag:'UPDATE',project:pid?getPN(pid):null});if(row)S.logs.unshift(row);}
  else if(type==='someday'){const row=await dbInsert('someday',{text,category:'General'});if(row)S.someday.unshift(row);}
  else if(type==='focus'){const row=await dbInsert('weekly_focus',{text,project_id:pid||null,week_of:getMonday(),done:false});if(row)S.weeklyFocus.unshift(row);}
  toast('Added.'); closeQuickAdd(); render();
}
function initQuickAdd(){
  document.getElementById('qa-backdrop').onclick=closeQuickAdd;
  document.getElementById('qa-submit').onclick=submitQuickAdd;
  document.getElementById('qa-input').onkeydown=e=>{if(e.key==='Enter')submitQuickAdd();if(e.key==='Escape')closeQuickAdd();};
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();openQuickAdd();}
    if(e.key==='Escape')closeQuickAdd();
  });
}

// ─── TIME LOGGING ─────────────────────────────────────────
function startTimer(taskId,projId){
  if(timerState.taskId===taskId){stopTimer();return;}
  if(timerState.taskId){stopTimer();}
  timerState={taskId,projId,startMs:Date.now(),interval:null,display:'0:00'};
  timerState.interval=setInterval(()=>{
    timerState.display=fmtTimer(timerState.startMs);
    const el=document.getElementById(`timer-${taskId}`);
    if(el)el.textContent=timerState.display;
  },1000);
  render();
}
async function stopTimer(){
  if(!timerState.taskId)return;
  clearInterval(timerState.interval);
  const secs=Math.floor((Date.now()-timerState.startMs)/1000);
  if(secs>30){
    await dbInsert('time_logs',{task_id:timerState.taskId,project_id:timerState.projId,duration_seconds:secs});
    toast(`Logged ${fmtSecs(secs)} of work.`);
  }
  timerState={taskId:null,projId:null,startMs:null,interval:null,display:'0:00'};
  render();
}

async function loadAll(){
  const [p,t,g,i,l,d,wf,sd,tl]=await Promise.all([

    supa.from('tasks').select('*').order('created_at',{ascending:false}),

    supa.from('infra').select('*').order('created_at',{ascending:false}),
    supa.from('logs').select('*').order('created_at',{ascending:false}),
    supa.from('study_domains').select('*').order('cert,name'),
    supa.from('weekly_focus').select('*').gte('week_of',getMonday()).order('created_at',{ascending:false}),
    supa.from('someday').select('*').order('created_at',{ascending:false}),
    supa.from('time_logs').select('*').order('created_at',{ascending:false}),
  ]);
  S.projects=p.data||[];S.tasks=t.data||[];S.goals=g.data||[];
  S.infra=i.data||[];S.logs=l.data||[];S.domains=d.data||[];
  S.weeklyFocus=wf.data||[];S.someday=sd.data||[];S.timeLogs=tl.data||[];
}
async function dbInsert(table,data){const {data:row,error}=await supa.from(table).insert(data).select().single();if(error){toast('Error: '+error.message);return null;}return row;}
async function dbUpdate(table,id,data){const {error}=await supa.from(table).update(data).eq('id',id);if(error){toast('Error: '+error.message);return false;}return true;}
async function dbDelete(table,id){const {error}=await supa.from(table).delete().eq('id',id);if(error){toast('Error: '+error.message);return false;}return true;}

    <div class="flex-between" style="margin-bottom:18px">

      <div class="flex-gap"><button class="btn-sm" id="btn-export-pdf">📄 Export Summary</button><button class="btn-accent" id="btn-add-project">${svg('M12 5v14M5 12h14',13)} Add</button></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Vertical</span>
      ${['All',...VERTS].map(v=>`<button class="filter-btn ${S.filterV===v?'active':''}" data-fv="${esc(v)}">${v}</button>`).join('')}
      <div class="divider"></div>
      <span class="filter-label">Status</span>
      ${['All',...STATS].map(s=>`<button class="filter-btn ${S.filterS===s?'active':''}" data-fs="${s}">${s==='All'?'All':(SM[s]?.label||s)}</button>`).join('')}

      ${filtered.map(p=>{
        const hs=healthScore(p),hc=hColor(hs),prog=projProg(p.id);

          <div style="font-family:'DM Serif Display',serif;font-size:15px;color:var(--t1);margin-bottom:10px;line-height:1.3;font-weight:400">${esc(p.name)}</div>

            <div class="flex-gap" style="gap:6px">

              <div class="health-badge" style="background:${hc}18;color:${hc};border:1px solid ${hc}28" title="Health score">${hs}</div>
              <div class="row-btns">
                <button class="icon-btn" data-edit-project="${p.id}">${svg('M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z',11)}</button>
                <button class="icon-btn del" data-del-project="${p.id}">${svg('M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',11)}</button>

          ${prog!==null?`<div class="proj-progress" style="margin-top:10px"><div class="proj-progress-fill" style="width:${prog}%;background:linear-gradient(90deg,${p.color||'#6ba3be'}70,${p.color||'#6ba3be'})"></div></div>`:''}

}

function renderProjectDetail(){
  const p=S.projects.find(x=>x.id===S.selectedProjectId);
  if(!p)return '<div>Not found.</div>';
  const pt=S.tasks.filter(t=>t.project_id===p.id);
  const hs=healthScore(p),hc=hColor(hs),prog=projProg(p.id);
  const tl=S.timeLogs.filter(l=>l.project_id===p.id);
  const totalTime=tl.reduce((a,l)=>a+l.duration_seconds,0);
  return `
    <button id="btn-back" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:6px;padding:0;font-family:'DM Sans',sans-serif">← Back to Projects</button>
    <div class="flex-between" style="margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-size:10px;color:${p.color||'#6ba3be'};letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">${esc(p.vertical||'')}</div>
        <h2 style="font-family:'DM Serif Display',serif;font-size:24px;color:var(--t1);font-weight:400">${esc(p.name)}</h2>
        <div style="font-size:11px;color:var(--t3);font-family:monospace;margin-top:4px">${esc(p.url||'')}</div>
      </div>
      <div class="flex-gap" style="flex-wrap:wrap">${badge(p.status)} ${priDot(p.priority)}
        <div class="health-badge" style="background:${hc}18;color:${hc};border:1px solid ${hc}28;width:auto;padding:2px 10px;border-radius:20px;font-size:10px">Health: ${hs}/100</div>
        <button class="btn-sm" data-edit-project="${p.id}">Edit</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px">
      <div class="card"><div class="section-label">Stack</div><div style="font-size:12px;color:var(--t2);line-height:1.7">${esc(p.stack||'Not specified')}</div></div>
      <div class="card"><div class="section-label">Notes</div><div style="font-size:12px;color:var(--t2);line-height:1.7">${esc(p.notes||'No notes.')}</div></div>
      <div class="card"><div class="section-label">Time Logged</div>
        <div style="font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent)">${totalTime>0?Math.round(totalTime/3600)+' hrs':'—'}</div>
        ${prog!==null?`<div style="margin-top:10px"><div class="flex-between" style="margin-bottom:4px"><span style="font-size:10px;color:var(--t3)">Task completion</span><span style="font-size:10px;color:var(--t2)">${prog}%</span></div>${pbar(prog,p.color||'#6ba3be',4)}</div>`:''}
      </div>
    </div>
    <div class="flex-between" style="margin-bottom:10px">
      <div class="section-label" style="margin-bottom:0">Task Board</div>
      <button class="btn-accent" id="btn-add-task-detail" style="font-size:12px;padding:6px 13px">${svg('M12 5v14M5 12h14',12)} Add Task</button>
    </div>
    <div class="kanban-grid">
      ${TCOLS.map(col=>{
        const cm=SM[col];
        const colT=pt.filter(t=>t.status===col);
        return `<div class="kanban-col" data-col="${col}">
          <div class="kanban-header"><span class="kanban-dot" style="background:${cm.color}"></span><span class="kanban-label" style="color:${cm.color}">${cm.label}</span><span class="kanban-count">${colT.length}</span></div>
          ${colT.length===0?'<div class="empty-state" style="font-size:11px;padding:18px 0">Empty</div>':''}
          ${colT.map(t=>{
            const isActiveTimer=timerState.taskId===t.id;
            return `<div class="task-card ${isActiveTimer?'':''}${t.status==='done'?'done-task':''}" draggable="true" data-task-card="${t.id}">
              ${t.recurring&&t.recurring!=='none'?`<span class="rec-badge" style="display:inline-block;margin-bottom:6px">${t.recurring}</span>`:''}
              <div style="font-size:13px;line-height:1.4;margin-bottom:7px">${esc(t.text)}</div>
              <div class="flex-between">${priDot(t.priority)}${t.estimate?`<span style="font-size:10px;color:var(--t3)">${t.estimate}h</span>`:''}</div>
              ${t.due_date?`<div style="font-size:10px;color:var(--t3);margin-top:5px">Due ${fmtDate(t.due_date)}</div>`:''}
              <div class="flex-between" style="margin-top:8px">
                ${t.tag?tagChip(t.tag):'<span></span>'}
                <div class="flex-gap" style="gap:4px">
                  ${isActiveTimer?`<span class="timer-display" id="timer-${t.id}">${timerState.display}</span>`:''}
                  <button class="timer-btn-sm ${isActiveTimer?'active':''}" data-start-timer="${t.id}" data-proj-timer="${t.project_id||''}">${isActiveTimer?'⏹':'▶'}</button>
                  <div class="row-btns" style="opacity:1">
                    <button class="icon-btn" data-edit-task="${t.id}">${svg('M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z',11)}</button>
                    <button class="icon-btn del" data-del-task="${t.id}">${svg('M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',11)}</button>
                  </div>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>`;
}

      <div><h2 class="page-title" style="margin-bottom:4px">Weekly Focus</h2>

// ─── RECURRING TASK HANDLER ───────────────────────────────
async function handleRecurringOnDone(task){
  if(!task.recurring||task.recurring==='none')return;
  const newDue=task.due_date?new Date(task.due_date):new Date();
  if(task.recurring==='daily') newDue.setDate(newDue.getDate()+1);
  else if(task.recurring==='weekly') newDue.setDate(newDue.getDate()+7);
  else if(task.recurring==='monthly') newDue.setMonth(newDue.getMonth()+1);
  const row=await dbInsert('tasks',{text:task.text,project_id:task.project_id,status:'todo',priority:task.priority,tag:task.tag,estimate:task.estimate,due_date:newDue.toISOString().split('T')[0],recurring:task.recurring});
  if(row){S.tasks.unshift(row);toast(`Recurring task recreated for ${fmtDate(row.due_date)}`);}
}

// ─── EVENT BINDING ────────────────────────────────────────
function bindEvents(){
  const m=document.getElementById('main-inner');
  if(!m)return;

  document.querySelectorAll('[data-nav]').forEach(b=>{b.onclick=()=>{S.section=b.dataset.nav;S.selectedProjectId=null;render();};});
  m.querySelectorAll('[data-fv]').forEach(b=>{b.onclick=()=>{S.filterV=b.dataset.fv;render();};});
  m.querySelectorAll('[data-fs]').forEach(b=>{b.onclick=()=>{S.filterS=b.dataset.fs;render();};});
  m.querySelectorAll('[data-fp]').forEach(b=>{b.onclick=()=>{S.filterP=b.dataset.fp;render();};});

  // Project detail
  m.querySelectorAll('[data-project-id]').forEach(c=>{c.onclick=e=>{if(e.target.closest('.icon-btn')||e.target.closest('.row-btns'))return;S.selectedProjectId=c.dataset.projectId;render();};});
  const bb=document.getElementById('btn-back');if(bb)bb.onclick=()=>{S.selectedProjectId=null;render();};

  // Add
  const ap=document.getElementById('btn-add-project');if(ap)ap.onclick=()=>openProjectModal();
  const at=document.getElementById('btn-add-task');if(at)at.onclick=()=>openTaskModal();
  const atd=document.getElementById('btn-add-task-detail');if(atd)atd.onclick=()=>openTaskModal(null,S.selectedProjectId);
  const ag=document.getElementById('btn-add-goal');if(ag)ag.onclick=()=>openGoalModal();
  const ai=document.getElementById('btn-add-infra');if(ai)ai.onclick=()=>openInfraModal();
  const ad=document.getElementById('btn-add-domain');if(ad)ad.onclick=()=>openDomainModal();
  const af=document.getElementById('btn-add-focus');if(af)af.onclick=()=>openFocusModal();
  const as=document.getElementById('btn-add-someday');if(as)as.onclick=()=>openSomedayModal();
  const ep=document.getElementById('btn-export-pdf');if(ep)ep.onclick=exportPDF;

  // Edit
  m.querySelectorAll('[data-edit-project]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const p=S.projects.find(x=>x.id===b.dataset.editProject);if(p)openProjectModal(p);};});
  m.querySelectorAll('[data-edit-task]').forEach(b=>{b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.editTask);if(t)openTaskModal(t);};});
  m.querySelectorAll('[data-edit-goal]').forEach(b=>{b.onclick=()=>{const g=S.goals.find(x=>x.id===b.dataset.editGoal);if(g)openGoalModal(g);};});
  m.querySelectorAll('[data-edit-infra]').forEach(b=>{b.onclick=()=>{const i=S.infra.find(x=>x.id===b.dataset.editInfra);if(i)openInfraModal(i);};});
  m.querySelectorAll('[data-edit-domain]').forEach(b=>{b.onclick=()=>{const d=S.domains.find(x=>x.id===b.dataset.editDomain);if(d)openDomainModal(d);};});

  // Delete
  m.querySelectorAll('[data-del-project]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const id=b.dataset.delProject;confirmDel('Delete this project and all its tasks?',async()=>{await dbDelete('projects',id);S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.project_id!==id);if(S.selectedProjectId===id)S.selectedProjectId=null;closeModal();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-del-task]').forEach(b=>{b.onclick=()=>{const id=b.dataset.delTask;confirmDel('Delete this task?',async()=>{await dbDelete('tasks',id);S.tasks=S.tasks.filter(t=>t.id!==id);closeModal();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-del-goal]').forEach(b=>{b.onclick=()=>{const id=b.dataset.delGoal;confirmDel('Delete this goal?',async()=>{await dbDelete('goals',id);S.goals=S.goals.filter(g=>g.id!==id);closeModal();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-del-infra]').forEach(b=>{b.onclick=()=>{const id=b.dataset.delInfra;confirmDel('Delete this record?',async()=>{await dbDelete('infra',id);S.infra=S.infra.filter(i=>i.id!==id);closeModal();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-del-domain]').forEach(b=>{b.onclick=()=>{const id=b.dataset.delDomain;confirmDel('Delete this domain?',async()=>{await dbDelete('study_domains',id);S.domains=S.domains.filter(d=>d.id!==id);closeModal();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-del-log]').forEach(b=>{b.onclick=()=>{const id=b.dataset.delLog;confirmDel('Delete this entry?',async()=>{await dbDelete('logs',id);S.logs=S.logs.filter(l=>l.id!==id);closeModal();toast('Deleted.');render();});};});
  m.querySelectorAll('[data-del-focus]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.delFocus;await dbDelete('weekly_focus',id);S.weeklyFocus=S.weeklyFocus.filter(f=>f.id!==id);toast('Removed.');render();};});
  m.querySelectorAll('[data-del-someday]').forEach(b=>{b.onclick=()=>{const id=b.dataset.delSomeday;confirmDel('Remove from parking lot?',async()=>{await dbDelete('someday',id);S.someday=S.someday.filter(s=>s.id!==id);closeModal();toast('Removed.');render();});};});

  // Weekly focus toggle
  m.querySelectorAll('[data-focus-toggle]').forEach(el=>{
    el.onclick=async()=>{
      const id=el.dataset.focusToggle;
      const f=S.weeklyFocus.find(x=>x.id===id);
      if(!f)return;
      const newDone=!f.done;
      await dbUpdate('weekly_focus',id,{done:newDone});
      f.done=newDone;
      render();
    };
  });

  // Someday to task
  m.querySelectorAll('[data-someday-to-task]').forEach(b=>{
    b.onclick=async()=>{
      const id=b.dataset.somedayToTask;
      const s=S.someday.find(x=>x.id===id);
      if(!s)return;
      const row=await dbInsert('tasks',{text:s.text,status:'todo',priority:'medium',tag:'UPDATE'});
      if(row){S.tasks.unshift(row);await dbDelete('someday',id);S.someday=S.someday.filter(x=>x.id!==id);toast('Moved to Tasks.');render();}
    };
  });

  // Timer buttons
  m.querySelectorAll('[data-start-timer]').forEach(b=>{
    b.onclick=()=>startTimer(b.dataset.startTimer,b.dataset.projTimer||null);
  });

  // Drag and drop
  m.querySelectorAll('[data-task-card]').forEach(card=>{
    card.addEventListener('dragstart',e=>{draggedTaskId=card.dataset.taskCard;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
  m.querySelectorAll('.kanban-col[data-col]').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      if(!draggedTaskId)return;
      const newStatus=col.dataset.col;
      const task=S.tasks.find(t=>t.id===draggedTaskId);
      if(!task||task.status===newStatus){draggedTaskId=null;return;}
      const wasDone=newStatus==='done'&&task.status!=='done';
      await dbUpdate('tasks',draggedTaskId,{status:newStatus});
      task.status=newStatus;
      if(wasDone&&task.recurring&&task.recurring!=='none')await handleRecurringOnDone(task);
      draggedTaskId=null;render();
    });
  });

  // Log submit
  const lb=document.getElementById('btn-log');
  if(lb){
    const doLog=async()=>{
      const text=document.getElementById('log-text').value.trim();
      const tag=document.getElementById('log-tag').value;
      const project=document.getElementById('log-project').value.trim();
      if(!text){toast('Enter something.');return;}
      lb.textContent='Logging...';
      const row=await dbInsert('logs',{text,tag,project:project||null});
      if(row){S.logs.unshift(row);toast('Logged.');}
      lb.textContent='Log it';render();
    };
    lb.onclick=doLog;
    document.getElementById('log-text').onkeydown=e=>{if(e.key==='Enter')doLog();};
  }

  // Modal backdrop
  document.getElementById('modal-overlay').onclick=e=>{if(e.target===document.getElementById('modal-overlay'))closeModal();};

  // Login
  const loginBtn=document.getElementById('login-btn');
  if(loginBtn){loginBtn.onclick=login;document.getElementById('login-pass').onkeydown=e=>{if(e.key==='Enter')login();};}
}

// ─── RENDER ───────────────────────────────────────────────
function render(){
  renderSidebar();
  let html='';
  if(S.section==='dashboard')      html=renderDashboard();
  else if(S.section==='projects')  html=S.selectedProjectId?renderProjectDetail():renderProjects();
  else if(S.section==='tasks')     html=renderTasks();
  else if(S.section==='focus')     html=renderFocus();
  else if(S.section==='goals')     html=renderGoals();
  else if(S.section==='infra')     html=renderInfra();
  else if(S.section==='study')     html=renderStudy();
  else if(S.section==='someday')   html=renderSomeday();
  else if(S.section==='log')       html=renderLog();
  document.getElementById('main-inner').innerHTML=html;
  bindEvents();
}

// ─── BOOT ─────────────────────────────────────────────────
async function bootApp(){
  document.getElementById('loading').style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  applyTheme();
  await loadAll();
  render();
  initPomo();
  initQuickAdd();
}

async function init(){
  const {data:{session}}=await supa.auth.getSession();
  document.getElementById('loading').style.display='none';
  if(session){await bootApp();}
  else{document.getElementById('login-screen').style.display='flex';applyTheme();bindEvents();}
}

init();
</script>
</body>
</html>
