<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulan OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050508;--surface:#0f1117;--surface2:#161922;--surface3:#1c2130;
  --t1:#f8fafc;--t2:#94a3b8;--t3:#3d4a5c;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --c-dashboard:#3b82f6;--c-projects:#10b981;--c-tasks:#f59e0b;
  --c-focus:#8b5cf6;--c-goals:#f43f5e;--c-infra:#06b6d4;
  --c-study:#f97316;--c-someday:#94a3b8;--c-log:#14b8a6;--c-settings:#64748b;
  --current-color:#3b82f6;
  --fs:15px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Outfit',sans-serif;font-size:var(--fs);background:var(--bg);color:var(--t1);line-height:1.6;}
h1,h2,h3{font-family:'Syne',sans-serif;}
input,textarea,select{font-family:'Outfit',sans-serif;font-size:calc(var(--fs) - 1px);outline:none;color:var(--t1);}
input::placeholder,textarea::placeholder{color:var(--t3);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.2s ease;}
.pulse{animation:pulse 2s infinite;}

/* LOADING */
#loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:14px;}
.ld-ring{width:30px;height:30px;border:2px solid var(--surface3);border-top-color:var(--c-dashboard);border-radius:50%;animation:spin 0.8s linear infinite;}
.ld-text{font-size:12px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;}

/* LOGIN */
#login-screen{display:none;align-items:center;justify-content:center;height:100vh;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:44px 40px;width:400px;animation:scaleIn 0.3s ease;}
.login-brand{font-size:9px;color:var(--t3);letter-spacing:3.5px;text-transform:uppercase;margin-bottom:6px;}
.login-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--t1);margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--t3);margin-bottom:32px;}
.fl{margin-bottom:16px;}
.fl label{display:block;font-size:11px;color:var(--t2);margin-bottom:7px;letter-spacing:0.8px;text-transform:uppercase;font-weight:500;}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--t1);padding:11px 14px;transition:border-color 0.15s;}
.fi:focus{border-color:var(--c-dashboard);}
.btn-login{width:100%;background:var(--c-dashboard);border:none;border-radius:10px;color:#fff;padding:13px;font-size:var(--fs);font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;margin-top:4px;transition:opacity 0.15s;}
.btn-login:hover{opacity:0.88;}
.login-err{font-size:12px;color:#f43f5e;margin-top:10px;text-align:center;min-height:18px;}

/* APP */
#app{display:none;height:100vh;flex-direction:row;}

/* SIDEBAR */
#sidebar{width:232px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;flex-shrink:0;}
.sb-top{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.sb-org{font-size:9px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;font-weight:600;}
.sb-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--t1);}
.sb-qs{margin:12px 10px 0;display:flex;gap:6px;}
.sb-qa{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;border:1px solid rgba(59,130,246,0.3);background:rgba(59,130,246,0.08);color:var(--c-dashboard);font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:500;transition:all 0.15s;}
.sb-qa:hover{background:rgba(59,130,246,0.15);}
.sb-srch{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;}
.sb-srch:hover{color:var(--t1);border-color:var(--border2);}
#sb-nav{flex:1;padding:10px 8px;overflow-y:auto;}
.nav-sep{height:1px;background:var(--border);margin:6px 10px;}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:none;cursor:pointer;background:transparent;color:var(--t2);font-size:calc(var(--fs) - 1px);font-family:'Outfit',sans-serif;text-align:left;margin-bottom:2px;transition:all 0.12s;position:relative;overflow:hidden;}
.nav-btn .ndot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:transform 0.15s;}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--t1);}
.nav-btn:hover .ndot{transform:scale(1.3);}
.nav-btn.active{font-weight:500;}
.nav-btn.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;background:rgba(244,63,94,0.2);color:#f43f5e;padding:1px 8px;border-radius:8px;}
#sb-bottom{padding:12px 14px;border-top:1px solid var(--border);}
.sb-user{font-size:11px;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.sb-udot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 3s infinite;}
.sb-btns{display:flex;gap:6px;}
.sb-btn{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.12s;flex:1;text-align:center;}
.sb-btn:hover{color:var(--t1);border-color:var(--border2);}

/* MAIN */
#main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 26px;gap:14px;flex-shrink:0;}
#topbar-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;flex:1;}
#topbar-acts{display:flex;gap:8px;align-items:center;}
#main{flex:1;overflow-y:auto;padding:26px 28px;}

/* SHARED */
.sl{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-weight:600;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;}
.pbar-wrap{border-radius:10px;overflow:hidden;background:rgba(255,255,255,0.05);}
.pbar-fill{height:100%;border-radius:10px;}
.flex-b{display:flex;justify-content:space-between;align-items:center;}
.flex-g{display:flex;align-items:center;gap:8px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.empty-state{text-align:center;padding:50px 20px;}
.empty-state .es-icon{font-size:38px;margin-bottom:14px;}
.empty-state .es-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px;}
.empty-state .es-sub{font-size:13px;color:var(--t3);}

/* BUTTONS */
.btn{padding:8px 18px;border-radius:9px;border:none;font-size:calc(var(--fs) - 1px);font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;white-space:nowrap;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--t2);}
.btn-ghost:hover{color:var(--t1);border-color:var(--border2);background:rgba(255,255,255,0.04);}
.btn-danger{background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.25);color:#f43f5e;}
.btn-danger:hover{background:rgba(244,63,94,0.2);}
.btn-col{color:#fff;}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--t3);display:inline-flex;align-items:center;border-radius:5px;transition:all 0.12s;}
.icon-btn:hover{color:var(--t1);background:rgba(255,255,255,0.06);}
.icon-btn.del:hover{color:#f43f5e;background:rgba(244,63,94,0.1);}
.row-btns{display:flex;gap:2px;opacity:0;transition:opacity 0.12s;}
.card:hover .row-btns,.p-card:hover .row-btns,.t-card:hover .row-btns{opacity:1;}

/* SAVING INDICATOR */
.saving{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);}
.saving .sring{width:12px;height:12px;border:1.5px solid var(--border2);border-top-color:var(--current-color);border-radius:50%;animation:spin 0.7s linear infinite;}

/* FILTERS */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.flabel{font-size:9px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-right:2px;font-weight:600;}
.fbtn{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.12s;}
.fbtn.active{border-color:var(--current-color);color:var(--current-color);background:rgba(255,255,255,0.04);}
.fbtn:hover:not(.active){color:var(--t1);}
.fdiv{width:1px;height:18px;background:var(--border);margin:0 4px;}

/* PROJECT CARDS */
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.p-card{background:var(--surface);border-radius:14px;padding:20px;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;border:1px solid transparent;}
.p-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.p-glow{position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;pointer-events:none;}
.p-vert{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:7px;font-weight:600;}
.p-name{font-family:'Syne',sans-serif;font-size:17px;margin-bottom:13px;line-height:1.25;font-weight:700;}
.h-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;cursor:help;}
.p-bar{height:2px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;margin-top:12px;}
.p-bar-f{height:100%;border-radius:10px;}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
.k-col{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;min-height:220px;transition:border-color 0.15s;}
.k-col.drag-over{border-color:var(--current-color);background:rgba(255,255,255,0.01);}
.k-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.k-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.k-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.k-cnt{margin-left:auto;font-size:10px;color:var(--t3);background:rgba(255,255,255,0.05);padding:1px 8px;border-radius:8px;}
.t-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:9px;cursor:grab;transition:box-shadow 0.15s,opacity 0.15s;}
.t-card:active{cursor:grabbing;}
.t-card.dragging{opacity:0.3;}
.t-card-proj{font-size:10px;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;}
.t-card-text{font-size:var(--fs);line-height:1.45;margin-bottom:9px;}
.t-card-meta{display:flex;justify-content:space-between;align-items:center;}
.pri-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.pri-pip{width:5px;height:5px;border-radius:50%;}
.tag-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:1px;text-transform:uppercase;}
.rec-badge{font-size:10px;padding:2px 8px;border-radius:5px;background:rgba(59,130,246,0.12);color:#3b82f6;border:1px solid rgba(59,130,246,0.2);margin-bottom:7px;display:inline-block;}

/* STAT CARDS */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;}
.stat-num{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;line-height:1;margin-bottom:5px;}
.stat-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:0.7px;line-height:1.4;font-weight:500;}

/* ALERT */
.alert-bar{background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;}
.alert-item{font-size:13px;line-height:1.6;}
.alert-type{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#f59e0b;margin-right:6px;}

/* FOCUS ITEMS */
.focus-item{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;transition:opacity 0.2s;}
.focus-item.done-fi{opacity:0.45;}
.f-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--t3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;margin-top:2px;}
.f-check.checked{background:var(--c-focus);border-color:var(--c-focus);}

/* SOMEDAY */
.sd-item{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;}

/* PINNED NOTE */
.pinned{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.2);border-radius:10px;padding:13px 16px;margin-bottom:18px;}
.pinned-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#f59e0b;margin-bottom:6px;}

/* SEARCH */
#search-overlay{display:none;position:fixed;inset:0;z-index:200;align-items:flex-start;justify-content:center;padding-top:100px;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);}
#search-overlay.show{display:flex;}
.srch-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:580px;max-width:92vw;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.6);animation:scaleIn 0.18s ease;}
.srch-in-wrap{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);}
#srch-in{flex:1;background:transparent;border:none;color:var(--t1);font-size:17px;font-family:'Outfit',sans-serif;}
.srch-results{max-height:360px;overflow-y:auto;padding:8px;}
.sr-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;transition:background 0.1s;}
.sr-item:hover{background:var(--surface2);}
.sr-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;width:56px;flex-shrink:0;}
.sr-text{font-size:14px;flex:1;}
.sr-sub{font-size:11px;color:var(--t3);}

/* QUICK ADD */
#qa-overlay{display:none;position:fixed;inset:0;z-index:180;align-items:flex-start;justify-content:center;padding-top:130px;}
#qa-overlay.show{display:flex;}
.qa-bg{position:absolute;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);}
.qa-box{position:relative;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:18px 20px;width:560px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:fadeUp 0.18s ease;}
.qa-hint{font-size:10px;color:var(--t3);margin-bottom:10px;}
#qa-in{width:100%;background:transparent;border:none;color:var(--t1);font-size:17px;font-family:'Outfit',sans-serif;padding:0;margin-bottom:14px;}
.qa-sel{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--t2);padding:6px 11px;font-size:12px;font-family:'Outfit',sans-serif;cursor:pointer;}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);z-index:150;align-items:center;justify-content:center;}
#modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:30px 32px;width:500px;max-width:94vw;max-height:88vh;overflow-y:auto;animation:scaleIn 0.2s ease;}
.modal-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:22px;}
.m-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.m-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
.fl2{margin-bottom:14px;}
.fl2 label{display:block;font-size:10px;color:var(--t2);margin-bottom:6px;letter-spacing:0.8px;text-transform:uppercase;font-weight:600;}
.fi2{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--t1);padding:10px 13px;transition:border-color 0.15s;font-family:'Outfit',sans-serif;}
.fi2:focus{border-color:var(--current-color);}
textarea.fi2{resize:vertical;min-height:80px;}
select.fi2{cursor:pointer;}

/* FOCUS MODE */
#focus-mode{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;}
#focus-mode.show{display:flex;}
.fm-lbl{font-size:11px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.fm-task{font-family:'Syne',sans-serif;font-size:26px;color:var(--t1);max-width:620px;text-align:center;line-height:1.3;margin-bottom:30px;font-weight:700;}
.fm-time{font-family:'Syne',sans-serif;font-size:76px;color:var(--c-focus);line-height:1;margin-bottom:28px;font-weight:800;letter-spacing:-3px;}
.fm-time.warn{color:#f43f5e;}
.fm-ctls{display:flex;gap:10px;}
.fm-btn{padding:12px 28px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--t1);font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.15s;}
.fm-btn.primary{background:var(--c-focus);border-color:var(--c-focus);color:#fff;}
.fm-btn:hover:not(.primary){border-color:var(--border2);}
.fm-exit{position:fixed;top:20px;right:20px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--t3);font-size:12px;cursor:pointer;padding:6px 12px;font-family:'Outfit',sans-serif;transition:all 0.15s;}
.fm-exit:hover{color:var(--t1);}
.fm-sess{font-size:12px;color:var(--t3);margin-top:18px;}

/* SETTINGS */
.srow{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);}
.srow:last-child{border-bottom:none;}
.srow-lbl{font-size:var(--fs);margin-bottom:3px;}
.srow-sub{font-size:12px;color:var(--t3);}
.fs-btns{display:flex;gap:6px;}
.fs-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s;}
.fs-btn.active{border-color:var(--c-dashboard);color:var(--c-dashboard);background:rgba(59,130,246,0.08);}
.fs-btn:hover:not(.active){color:var(--t1);}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:11px 22px;font-size:13px;color:var(--t1);opacity:0;transition:all 0.22s;z-index:400;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{border-color:rgba(244,63,94,0.4);color:#fda4af;}
</style>
</head>
<body>

<div id="loading"><div class="ld-ring"></div><span class="ld-text">Kulan OS</span></div>

<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">Kulan Group Ltd</div>
    <div class="login-title">Project OS</div>
    <div class="login-sub">Private workspace. Authorized access only.</div>

// ── HEALTH SCORE ───────────────────────────────────────────────
function health(p) {
  let s = 100;
  if(p.status==='at-risk') s -= 30;
  const pt = S.tasks.filter(t=>t.project_id===p.id);
  s -= pt.filter(t=>t.priority==='urgent'&&t.status!=='done').length * 15;
  s -= pt.filter(t=>t.due_date&&t.status!=='done'&&new Date(t.due_date+'T12:00:00')<new Date()).length * 10;
  if(S.infra.find(i=>i.project===p.name&&i.status==='at-risk')) s -= 20;
  if(S.logs.find(l=>l.project===p.name&&new Date(l.created_at)>new Date(Date.now()-7*864e5))) s += 10;
  return Math.max(0, Math.min(100, s));
}
const hc = s => s>=80?'#10b981':s>=60?'#f59e0b':s>=40?'#f97316':'#f43f5e';
const pprog = id => {
  const t = S.tasks.filter(x=>x.project_id===id);
  if(!t.length) return null;
  return Math.round(t.filter(x=>x.status==='done').length/t.length*100);
};

function alerts() {
  const now=new Date(), soon=new Date(now.getTime()+7*864e5), out=[];
  S.goals.filter(g=>g.deadline&&new Date(g.deadline+'T12:00:00')>=now&&new Date(g.deadline+'T12:00:00')<=soon).forEach(g=>out.push({name:g.name,date:g.deadline,type:'Goal'}));
  S.tasks.filter(t=>t.status!=='done'&&t.due_date&&new Date(t.due_date+'T12:00:00')>=now&&new Date(t.due_date+'T12:00:00')<=soon).forEach(t=>out.push({name:t.text,date:t.due_date,type:'Task'}));

}

// ── POMODORO ───────────────────────────────────────────────────
function pomoPB() {
  const d=document.getElementById('fm-timer'), b=document.getElementById('fm-play');
  if(!d) return;
  d.textContent = fmts(pomo.rem);
  d.className = 'fm-time' + (pomo.rem<=60?' warn':'');
  if(b) b.textContent = pomo.on&&!pomo.paused ? '⏸ Pause' : '▶ Start';
}
function pomoStart() {
  if(pomo.on&&!pomo.paused){pomo.paused=true;clearInterval(pomo.iv);pomoPB();return;}
  if(pomo.paused){pomo.paused=false;}
  else{if(pomo.rem<=0)pomo.rem=25*60;}
  pomo.on=true; pomo.paused=false;
  pomo.iv = setInterval(()=>{
    pomo.rem--;
    if(pomo.rem<=0){
      clearInterval(pomo.iv); pomo.on=false; pomo.rem=0; pomo.sessions++;
      const el=document.getElementById('fm-sess');
      if(el) el.textContent=`${pomo.sessions} session${pomo.sessions!==1?'s':''} today`;
      if(pomo.task) db.from('logs').insert({text:`Completed 25-min focus session${pomo.task?' on '+pomo.task:''}`,tag:'SYSTEM',project:pomo.task||null});
      toast('🍅 Session complete! Take a 5 min break.');
    }
    pomoPB();
  },1000);
  pomoPB();
}
function pomoReset(){clearInterval(pomo.iv);pomo.on=false;pomo.paused=false;pomo.rem=25*60;pomoPB();}
function openFM(taskText=''){
  pomo.task=taskText;
  const t=document.getElementById('fm-task');
  if(t) t.textContent=taskText||'No task selected — just focusing';
  document.getElementById('focus-mode').classList.add('show');
  pomoPB();
}
function closeFM(){pomoReset();document.getElementById('focus-mode').classList.remove('show');}

// ── SEARCH ─────────────────────────────────────────────────────
function openSearch(){document.getElementById('search-overlay').classList.add('show');setTimeout(()=>document.getElementById('srch-in').focus(),50);}
function closeSearch(){document.getElementById('search-overlay').classList.remove('show');document.getElementById('srch-in').value='';document.getElementById('srch-res').innerHTML='';}
function runSearch(q){
  if(!q.trim()){document.getElementById('srch-res').innerHTML='';return;}
  const ql=q.toLowerCase(), res=[];
  S.projects.filter(p=>p.name.toLowerCase().includes(ql)||(p.notes||'').toLowerCase().includes(ql)).forEach(p=>res.push({type:'Project',color:NC.projects,text:p.name,sub:p.vertical||'',act:()=>{S.section='projects';S.selProj=p.id;closeSearch();render();}}));
  S.tasks.filter(t=>t.text.toLowerCase().includes(ql)).forEach(t=>res.push({type:'Task',color:NC.tasks,text:t.text,sub:pn(t.project_id),act:()=>{S.section='tasks';closeSearch();render();}}));
  S.logs.filter(l=>l.text.toLowerCase().includes(ql)).slice(0,3).forEach(l=>res.push({type:'Log',color:NC.log,text:l.text,sub:fd(l.created_at),act:()=>{S.section='log';closeSearch();render();}}));
  S.goals.filter(g=>g.name.toLowerCase().includes(ql)).forEach(g=>res.push({type:'Goal',color:NC.goals,text:g.name,sub:`${g.progress||0}% complete`,act:()=>{S.section='goals';closeSearch();render();}}));
  const rDiv=document.getElementById('srch-res');
  if(!res.length){rDiv.innerHTML='<div style="text-align:center;padding:32px;font-size:13px;color:var(--t3)">No results found</div>';return;}
  rDiv.innerHTML=res.slice(0,10).map((r,i)=>`<div class="sr-item" data-sri="${i}"><span class="sr-type" style="color:${r.color}">${r.type}</span><span class="sr-text">${esc(r.text)}</span><span class="sr-sub">${esc(r.sub)}</span></div>`).join('');
  rDiv.querySelectorAll('[data-sri]').forEach(el=>{el.onclick=()=>res[+el.dataset.sri].act();});
}

async function submitQA(){
  const text=document.getElementById('qa-in').value.trim();
  const type=document.getElementById('qa-type').value;
  const pid=document.getElementById('qa-proj').value||null;
  const prio=document.getElementById('qa-pri').value;
  if(!text) return;
  if(type==='task'){const r=await dbi('tasks',{text,project_id:pid,status:'todo',priority:prio,tag:'UPDATE',recurring:'none'});if(r)S.tasks.unshift(r);}
  else if(type==='log'){const r=await dbi('logs',{text,tag:'UPDATE',project:pid?pn(pid):null});if(r)S.logs.unshift(r);}
  else if(type==='someday'){const r=await dbi('someday',{text,category:'General'});if(r)S.someday.unshift(r);}
  else if(type==='focus'){const r=await dbi('weekly_focus',{text,project_id:pid,week_of:mon(),done:false});if(r)S.focus.unshift(r);}
  toast('Added.'); closeQA(); render();
}

  S.domains=d.data||[]; S.focus=f.data||[]; S.someday=s.data||[];
  S.timeLogs=tl.data||[];
}

// ── CRITICAL FIX: Always reload after mutations ─────────────────
async function dbi(table,data){
  const {data:r,error}=await db.from(table).insert(data).select().single();
  if(error){toast('Save failed: '+error.message,true);console.error('Insert error',table,error);return null;}
  return r;
}
async function dbu(table,id,data){
  const {error}=await db.from(table).update(data).eq('id',id);
  if(error){toast('Update failed: '+error.message,true);console.error('Update error',table,error);return false;}
  return true;
}
async function dbd(table,id){
  const {error}=await db.from(table).delete().eq('id',id);
  if(error){toast('Delete failed: '+error.message,true);return false;}
  return true;
}

  else if(S.section==='study')   h=`<button class="btn btn-col" id="tb-ad" style="background:${col}">${bx('plus',13)} Add Domain</button>`;
  else if(S.section==='focus')   h=`<button class="btn btn-col" id="tb-af" style="background:${col}">${bx('plus',13)} Add Focus Item</button>`;
  else if(S.section==='someday') h=`<button class="btn btn-col" id="tb-as" style="background:${col}">${bx('plus',13)} Park an idea</button>`;
  a.innerHTML=h;
}

// ── RECURRING CHECK ────────────────────────────────────────────
// BUG FIX: Only consider a task recurring if explicitly set to a real value
function isRecurring(task) {
  return task.recurring && task.recurring !== 'none' && task.recurring !== '' && task.recurring !== null && task.recurring !== undefined;
}

// ── RECURRING HANDLER ──────────────────────────────────────────
async function handleRec(task) {
  if(!isRecurring(task)) return; // strict guard
  const nd = task.due_date ? new Date(task.due_date+'T12:00:00') : new Date();
  if(task.recurring==='daily')   nd.setDate(nd.getDate()+1);
  else if(task.recurring==='weekly')  nd.setDate(nd.getDate()+7);
  else if(task.recurring==='monthly') nd.setMonth(nd.getMonth()+1);
  const r = await dbi('tasks',{
    text:task.text, project_id:task.project_id, status:'todo',
    priority:task.priority, tag:task.tag, estimate:task.estimate,
    due_date:nd.toISOString().split('T')[0], recurring:task.recurring
  });
  if(r){S.tasks.unshift(r);toast(`↻ Recurring task regenerated for ${fd(r.due_date)}`);}
}

  mi.querySelectorAll('[data-fp]').forEach(b=>{b.onclick=()=>{S.fP=b.dataset.fp;render();};});

  // Project card click
  mi.querySelectorAll('[data-pid]').forEach(c=>{c.onclick=e=>{if(e.target.closest('.icon-btn')||e.target.closest('.row-btns'))return;S.selProj=c.dataset.pid;render();};});

  // Focus task launch
  mi.querySelectorAll('[data-ft-task]').forEach(b=>{b.onclick=e=>{e.stopPropagation();openFM(b.dataset.ftTask);};});

  // Focus toggle checkboxes
  mi.querySelectorAll('[data-ft]').forEach(el=>{
    el.onclick=async()=>{
      const id=el.dataset.ft, f=S.focus.find(x=>x.id===id);
      if(!f)return;
      await dbu('weekly_focus',id,{done:!f.done});
      f.done=!f.done;
      render();
    };
  });

  // Edit
  mi.querySelectorAll('[data-ep]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const p=S.projects.find(x=>x.id===b.dataset.ep);if(p)mProject(p);};});
  mi.querySelectorAll('[data-et]').forEach(b=>{b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.et);if(t)mTask(t);};});
  mi.querySelectorAll('[data-eg]').forEach(b=>{b.onclick=()=>{const g=S.goals.find(x=>x.id===b.dataset.eg);if(g)mGoal(g);};});
  mi.querySelectorAll('[data-ei]').forEach(b=>{b.onclick=()=>{const i=S.infra.find(x=>x.id===b.dataset.ei);if(i)mInfra(i);};});
  mi.querySelectorAll('[data-ed]').forEach(b=>{b.onclick=()=>{const d=S.domains.find(x=>x.id===b.dataset.ed);if(d)mDomain(d);};});

  // Delete
  mi.querySelectorAll('[data-dp]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const id=b.dataset.dp;confirmDel('Permanently delete this project and all its tasks?',async()=>{const ok=await dbd('projects',id);if(ok){S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.project_id!==id);if(S.selProj===id)S.selProj=null;}closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dt]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dt;confirmDel('Delete this task?',async()=>{const ok=await dbd('tasks',id);if(ok)S.tasks=S.tasks.filter(t=>t.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dg]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dg;confirmDel('Delete this goal?',async()=>{const ok=await dbd('goals',id);if(ok)S.goals=S.goals.filter(g=>g.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-di]').forEach(b=>{b.onclick=()=>{const id=b.dataset.di;confirmDel('Delete this record?',async()=>{const ok=await dbd('infra',id);if(ok)S.infra=S.infra.filter(i=>i.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dd]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dd;confirmDel('Delete this domain?',async()=>{const ok=await dbd('study_domains',id);if(ok)S.domains=S.domains.filter(d=>d.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-dl]').forEach(b=>{b.onclick=()=>{const id=b.dataset.dl;confirmDel('Delete this log entry?',async()=>{const ok=await dbd('logs',id);if(ok)S.logs=S.logs.filter(l=>l.id!==id);closeM();toast('Deleted.');render();});};});
  mi.querySelectorAll('[data-df]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.df;const ok=await dbd('weekly_focus',id);if(ok)S.focus=S.focus.filter(f=>f.id!==id);toast('Removed.');render();};});
  mi.querySelectorAll('[data-ds]').forEach(b=>{b.onclick=()=>{const id=b.dataset.ds;confirmDel('Remove from parking lot?',async()=>{const ok=await dbd('someday',id);if(ok)S.someday=S.someday.filter(s=>s.id!==id);closeM();toast('Removed.');render();});};});

  // Someday → Task
  mi.querySelectorAll('[data-stot]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.stot,s=S.someday.find(x=>x.id===id);if(!s)return;const r=await dbi('tasks',{text:s.text,status:'todo',priority:'medium',tag:'UPDATE',recurring:'none'});if(r){S.tasks.unshift(r);const ok=await dbd('someday',id);if(ok)S.someday=S.someday.filter(x=>x.id!==id);toast('Moved to Tasks.');render();}};});

  // Drag and drop
  mi.querySelectorAll('[data-tc]').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.tc;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
  mi.querySelectorAll('.k-col[data-col]').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('drag-over');});
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      if(!dragId)return;
      const ns=col.dataset.col, task=S.tasks.find(t=>t.id===dragId);
      if(!task){dragId=null;return;}
      if(task.status===ns){dragId=null;return;} // same column, skip
      const movingToDone = ns==='done' && task.status!=='done';
      await dbu('tasks',dragId,{status:ns});
      task.status=ns;
      // BUG FIX: Only call handleRec if task is EXPLICITLY recurring
      if(movingToDone && isRecurring(task)){
        await handleRec(task);
      }
      dragId=null;
      render();
    });
  });

  // Log
  const lgb=document.getElementById('lg-btn');
  if(lgb){
    const doLog=async()=>{
      const text=document.getElementById('lg-text').value.trim();
      const tg=document.getElementById('lg-tag').value;
      const proj=document.getElementById('lg-proj').value.trim();
      if(!text){toast('Enter something to log.',true);return;}
      lgb.textContent='Logging...';lgb.disabled=true;
      const r=await dbi('logs',{text,tag:tg,project:proj||null});
      if(r){S.logs.unshift(r);toast('Logged.');}
      lgb.textContent='Log it';lgb.disabled=false;
      render();
    };
    lgb.onclick=doLog;
    document.getElementById('lg-text').onkeydown=e=>{if(e.key==='Enter')doLog();};
  }

  // Settings
  mi.querySelectorAll('[data-fs-set]').forEach(b=>{b.onclick=()=>{applyFS(b.dataset.fsSet);render();};});
  const eb=document.getElementById('exp-btn');if(eb)eb.onclick=exportPDF;

  // Modal backdrop
  document.getElementById('modal-overlay').onclick=e=>{if(e.target===document.getElementById('modal-overlay'))closeM();};

  // Login
  const lb=document.getElementById('l-btn');
  if(lb){lb.onclick=login;const lp=document.getElementById('l-pass');if(lp)lp.onkeydown=e=>{if(e.key==='Enter')login();};}
}

// ── RENDER ─────────────────────────────────────────────────────
function render(){
  setCC();
  renderSB();
  renderTopbar();
  let html='';
  if(S.section==='dashboard')      html=vDashboard();
  else if(S.section==='projects')  html=S.selProj?vProjDetail():vProjects();
  else if(S.section==='tasks')     html=vTasks();
  else if(S.section==='focus')     html=vFocus();
  else if(S.section==='goals')     html=vGoals();
  else if(S.section==='infra')     html=vInfra();
  else if(S.section==='study')     html=vStudy();
  else if(S.section==='someday')   html=vSomeday();
  else if(S.section==='log')       html=vLog();
  else if(S.section==='settings')  html=vSettings();
  document.getElementById('mi').innerHTML=html;
  bindEvents();
}

// ── GLOBAL SHORTCUTS ────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  const typing=['INPUT','TEXTAREA','SELECT'].includes(tag);
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();}
  if(e.key==='/'&&!typing){e.preventDefault();openQA();}
  if(e.key==='Escape'){closeSearch();closeQA();}
});
document.getElementById('sb-qa').onclick=openQA;
document.getElementById('sb-srch').onclick=openSearch;
document.getElementById('search-overlay').onclick=e=>{if(e.target===document.getElementById('search-overlay'))closeSearch();};
document.getElementById('srch-in').oninput=e=>runSearch(e.target.value);
document.getElementById('qa-bg').onclick=closeQA;
document.getElementById('qa-sub').onclick=submitQA;
document.getElementById('qa-in').onkeydown=e=>{if(e.key==='Enter')submitQA();if(e.key==='Escape')closeQA();};
document.getElementById('fm-x').onclick=closeFM;
document.getElementById('fm-play').onclick=pomoStart;
document.getElementById('fm-reset').onclick=pomoReset;

// ── BOOT ───────────────────────────────────────────────────────
async function boot(){
  document.getElementById('loading').style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  await loadAll();
  render();
}

async function init(){
  const {data:{session}}=await db.auth.getSession();
  document.getElementById('loading').style.display='none';
  if(session){await boot();}
  else{document.getElementById('login-screen').style.display='flex';bindEvents();}
}

init();
</script>
</body>
</html>
